    <script>
        tailwind.config = {

    <style>
        /* CSS Variables for Global Theming */
        :root {
            --app-bg: #f4f4f5; /* surface-100 */
            --panel-bg: #ffffff;
            --border-color: #e4e4e7; /* surface-200 */
            --text-primary: #18181b; /* surface-900 */
            --text-secondary: #52525b; /* surface-600 */
        }
        html.dark {
            --app-bg: #09090b; /* surface-950 */
            --panel-bg: #18181b; /* surface-900 */
            --border-color: #27272a; /* surface-800 */
            --text-primary: #f4f4f5; /* surface-100 */
            --text-secondary: #a1a1aa; /* surface-400 */
            color-scheme: dark; 
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%; /* Force 100vh app style */
            overflow: hidden; /* Main body doesn't scroll, inner panes do */
            background-color: var(--app-bg);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        /* Brand Gradient Text */
        .text-gradient-primary {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
        }

        /* IDE Style Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(161, 161, 170, 0.6); }
        .dark ::-webkit-scrollbar-thumb { background: rgba(82, 82, 91, 0.5); }
        .dark ::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.7); }

        /* Unified Panel Styling */
        .app-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border-radius: 0.75rem; /* rounded-xl */
        }
        .dark .app-panel {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* High-Performance Syntax Highlighting Overlay */
        .editor-container { position: relative; display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
        .editor-textarea, .editor-pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; /* Perfect IDE size */
            line-height: 1.6;
            white-space: pre-wrap !important;
            word-break: break-all !important;
            overflow-wrap: break-word !important;
            tab-size: 4;
            padding: 1rem !important; /* Standardized padding */
            margin: 0;
            border: none;
            width: 100%;
            height: 100%;
        }
        
        .editor-textarea {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            color: transparent !important; /* Hide text, show caret */
            background: transparent !important;
            caret-color: #10b981; /* Emerald caret */
            resize: none;
            z-index: 10;
        }
        .editor-textarea.no-highlight {
            color: var(--text-primary) !important;
            caret-color: inherit;
        }
        
        /* Sync selections */
        .editor-textarea::selection { background: rgba(16, 185, 129, 0.2); color: transparent; }
        .dark .editor-textarea::selection { background: rgba(16, 185, 129, 0.3); color: transparent; }

        .editor-pre {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            overflow: auto;
            color: var(--text-primary);
        }

        /* Highlight Colors */
        .json-key { color: #0284c7; } .dark .json-key { color: #38bdf8; } /* Light Blue */
        .json-string { color: #059669; } .dark .json-string { color: #34d399; } /* Emerald */
        .json-number { color: #7c3aed; } .dark .json-number { color: #a78bfa; } /* Violet */
        .json-boolean { color: #e11d48; font-weight: 600; } .dark .json-boolean { color: #fb7185; } /* Rose */
        .json-bracket { color: #94a3b8; } .dark .json-bracket { color: #64748b; }

        /* Workspace Tab specific scrolling */
        .tab-scroll::-webkit-scrollbar { height: 2px; }

        /* Removes ugly default focus rings, applies custom */
        *:focus-visible { outline: 2px solid #10b981; outline-offset: 2px; }
        textarea:focus, input:focus, select:focus { outline: none; }
    </style>
</head>

                if (typeof j === 'object' && j !== null) { current = JSON.stringify(j, null, 2); isJson = true; } 
            } catch(e) {}
            
            return { original: inputStr, final: current, steps, b64Count, urlCount, isJson, isEncoded: steps.length > 0 };
        }

        function tokenizeCurl(str) {
            const tokens = []; let current = ''; let inSingle = false, inDouble = false, escapeNext = false;
            for(let i=0; i<str.length; i++) {
                const c = str[i];
                if (escapeNext) { if (c !== '\n' && c !== '\r') current += c; escapeNext = false; continue; }
                if (c === '\\') { escapeNext = true; continue; }
                if (c === "'" && !inDouble) { inSingle = !inSingle; continue; }
                if (c === '"' && !inSingle) { inDouble = !inDouble; continue; }
                if (/\s/.test(c) && !inSingle && !inDouble) { if (current) { tokens.push(current); current = ''; } continue; }
                current += c;
            }
            if (current) tokens.push(current);
            return tokens;
        }

        const CustomSelect = ({ value, onChange, options, icon, isDark, disabled = false }) => (

                                                {item.icon}

            const handleScroll = (e) => {

        const CurlDecoderTab = memo(({ isDark, setToast, curlInput, setCurlInput, parsedResults, setParsedResults }) => {
            const [redactSecrets, setRedactSecrets] = useState(false);
            const [codeLang, setCodeLang] = useState('fetch');

            const maskValue = (key, val) => {
                if (!redactSecrets || !val) return val;
                if (/auth|token|key|secret|session|cookie|pass|bearer|jwt/i.test(key)) {
                    if (val.length <= 8) return '••••••••';
                    return val.substring(0, 4) + '••••••••••••' + val.substring(val.length - 4);
                }
                return val;
            };

            const processRequest = (customInput) => {
                const rawCmd = typeof customInput === 'string' ? customInput : curlInput;
                if (!rawCmd.trim()) return;
                let results = { method: 'GET', url: 'No URL found', fullUrl: '', queryParams: [], cookies: [], headers: [], bodyDump: null, bodyParams: [], rawBody: '' };
                try {
                    const tokens = tokenizeCurl(rawCmd);
                    if (tokens.length === 0 || !tokens[0].toLowerCase().includes('curl')) return setToast("Error: Doesn't appear to be a valid cURL command.");

                    let skipNext = false;
                    for(let i = 1; i < tokens.length; i++) {
                        if (skipNext) { skipNext = false; continue; }
                        const t = tokens[i];
                        
                        if (t === '-X' || t === '--request') { results.method = tokens[i+1]?.toUpperCase() || 'GET'; skipNext = true; }
                        else if (t === '-H' || t === '--header') {
                            const header = tokens[i+1]; skipNext = true;
                            if (header) {
                                const splitIdx = header.indexOf(':');
                                if (splitIdx > -1) {
                                    const hName = header.substring(0, splitIdx).trim();
                                    const hVal = header.substring(splitIdx + 1).trim();
                                    if (hName.toLowerCase() === 'cookie') {
                                        hVal.split(';').forEach(pair => { 
                                            let eqIdx = pair.indexOf('='); 
                                            if(eqIdx > -1) results.cookies.push({ key: pair.substring(0, eqIdx).trim(), analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true) }); 
                                        });
                                    } else {
                                        let an = analyzeData(hVal);
                                        if (hName.toLowerCase() === 'authorization' && hVal.toLowerCase().startsWith('bearer ')) {
                                            an = analyzeData(hVal.split(' ')[1]); if(an.isEncoded) an.original = hVal; 
                                        }
                                        results.headers.push({ key: hName, rawVal: hVal, analysis: an });
                                    }
                                }
                            }
                        }
                        else if (t === '-b' || t === '--cookie') {
                            const cookieString = tokens[i+1]; skipNext = true;
                            if (cookieString) {
                                cookieString.split(';').forEach(pair => { 
                                    let eqIdx = pair.indexOf('='); 
                                    if(eqIdx > -1) results.cookies.push({ key: pair.substring(0, eqIdx).trim(), analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true) }); 
                                });
                            }
                        }
                        else if (t === '-d' || t === '--data' || t === '--data-raw' || t === '--data-binary' || t === '--data-urlencode') {
                            const bodyRaw = tokens[i+1]; skipNext = true;
                            if (results.method === 'GET') results.method = 'POST'; 
                            if (bodyRaw) {
                                let mergedData = bodyRaw.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
                                results.rawBody = mergedData;
                                if ((t === '--data-urlencode' || mergedData.includes('&')) && mergedData.includes('=') && !mergedData.trim().startsWith('{')) {
                                    try {
                                        const params = new URLSearchParams(mergedData);
                                        for (const [key, value] of params.entries()) results.bodyParams.push({ key, analysis: analyzeData(value, true) });
                                    } catch(e) { results.bodyDump = analyzeData(mergedData); }
                                } else { results.bodyDump = analyzeData(mergedData); }
                            }
                        }
                        else if (t === '--url') { results.url = tokens[i+1]; results.fullUrl = tokens[i+1]; skipNext = true; }
                        else if (t.startsWith('http://') || t.startsWith('https://')) { results.url = t; results.fullUrl = t; }
                    }

                    if (results.url && results.url !== 'No URL found') {
                        try {
                            const u = new URL(results.url);
                            results.url = u.origin + u.pathname;
                            for (const [key, value] of u.searchParams.entries()) results.queryParams.push({ key, analysis: analyzeData(value, true) });
                        } catch(e) {} 
                    }
                    setParsedResults(results); setToast("Payload Deep-Decoded! 🕵️‍♀️");
                } catch (e) { setToast("Error parsing cURL: " + e.message); }
            };

            const generateCodeSnippet = () => {
                if (!parsedResults) return '';
                const targetUrl = parsedResults.fullUrl || parsedResults.url;
                const hdrs = {};
                parsedResults.headers.forEach(h => { hdrs[h.key] = redactSecrets ? maskValue(h.key, h.analysis.original) : h.analysis.original; });
                if (parsedResults.cookies.length > 0) {
                    hdrs['Cookie'] = parsedResults.cookies.map(c => `${c.key}=${redactSecrets ? 'REDACTED' : c.analysis.original}`).join('; ');
                }

                if (codeLang === 'fetch') {
                    return `fetch(${JSON.stringify(targetUrl)}, {\n  method: ${JSON.stringify(parsedResults.method)},\n  headers: ${JSON.stringify(hdrs, null, 4).replace(/\n/g, '\n  ')}${parsedResults.rawBody ? `,\n  body: ${JSON.stringify(parsedResults.rawBody)}` : ''}\n})\n  .then(res => res.json())\n  .then(data => console.log(data));`;
                } else {
                    return `import requests\n\nurl = ${JSON.stringify(targetUrl)}\nheaders = ${JSON.stringify(hdrs, null, 4)}\n${parsedResults.rawBody ? `data = ${JSON.stringify(parsedResults.rawBody)}\n\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers, data=data)` : `\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers)`}\nprint(response.text)`;
                }
            };

            const AnalysisRow = ({ itemKey, analysis }) => {
                const displayFinal = maskValue(itemKey, analysis.final);
                const displayOriginal = maskValue(itemKey, analysis.original);

                if (!analysis.isEncoded) {
                    return (
                        <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <div className={`md:w-1/4 p-3 border-r flex items-center justify-between ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                                <span className={`font-semibold text-xs break-words ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>{itemKey}</span>
                            </div>
                            <div className="md:w-3/4 p-3 font-mono text-[13px] relative">
                                {analysis.isJson && !redactSecrets
                                    ? <div className={`p-3 rounded-lg overflow-x-auto relative border ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                        <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(analysis.final) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                      </div>
                                    : <div className={`break-words ${isDark ? 'text-zinc-300' : 'text-zinc-700'}`}>{escapeHTML(displayFinal)}</div>
                                }
                            </div>
                        </div>
                    );
                }
                
                let badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-500 border border-blue-500/30">ENCODED</span>;
                if (analysis.b64Count >= 3) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-500 border border-red-500/30 animate-pulse">⚠️ TRIPLE B64</span>;
                else if (analysis.b64Count === 2) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-orange-500/20 text-orange-500 border border-orange-500/30">🚨 DOUBLE B64</span>;
                else if (analysis.urlCount > 0) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-500 border border-emerald-500/30">URL ENCODED</span>;

                return (
                    <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                        <div className={`md:w-1/4 p-3 border-r ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <span className={`font-semibold text-xs break-words ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>{itemKey}</span>
                        </div>
                        <div className="md:w-3/4 p-3">
                            <div className="flex items-center gap-2 mb-3">{badge}</div>
                            <div className={`p-2 rounded-lg text-xs font-mono break-words mb-4 max-h-32 overflow-y-auto ${isDark ? 'bg-zinc-900 text-zinc-400' : 'bg-zinc-100 text-zinc-500'}`}>{escapeHTML(displayOriginal)}</div>
                            
                            <div className="space-y-3">
                                {analysis.steps.map((step, i) => {
                                    const isJSONView = (i === analysis.steps.length - 1) && analysis.isJson && !redactSecrets;
                                    return (
                                        <div key={i} className={`relative pl-4 border-l-2 ${isDark ? 'border-zinc-700' : 'border-zinc-200'}`}>
                                            <span className={`text-[10px] uppercase font-bold flex items-center gap-1.5 mb-1.5 ${isDark ? 'text-emerald-500' : 'text-emerald-600'}`}>
                                                {step.method}
                                            </span>
                                            {isJSONView ? (
                                                <div className={`p-2 rounded-lg overflow-x-auto max-h-[300px] font-mono text-xs border ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                                    <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(step.value) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                                </div>
                                            ) : (
                                                <div className={`p-2 rounded-lg font-mono text-xs break-words ${isDark ? 'bg-zinc-900 text-zinc-300' : 'bg-zinc-50 text-zinc-700'}`}>
                                                    {escapeHTML(maskValue(itemKey, step.value))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col gap-4 animate-fade-in w-full h-full pb-6">
                    <div className="app-panel flex flex-col flex-shrink-0">
                        <div className={`px-4 py-2.5 border-b flex flex-wrap items-center justify-between gap-2 ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}>
                            <div className="flex items-center gap-2">
                                <Icons.Terminal size={14} className="text-emerald-500" />
                                <span className="text-xs font-bold uppercase tracking-wider">Paste cURL Command</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => { setCurlInput(SAMPLE_CURL); processRequest(SAMPLE_CURL); }}
                                    className={`px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 border transition-all ${
                                        isDark ? 'bg-amber-500/10 border-amber-500/30 text-amber-400 hover:bg-amber-500/20' : 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100'
                                    }`}
                                >
                                    <Icons.Zap size={12} /> Try Sample cURL
                                </button>
                                <button
                                    onClick={() => setRedactSecrets(!redactSecrets)}
                                    className={`px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 border transition-all ${
                                        redactSecrets
                                        ? 'bg-rose-500/20 border-rose-500/40 text-rose-400'
                                        : (isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-400 hover:text-zinc-200' : 'bg-white border-zinc-200 text-zinc-600')
                                    }`}
                                    title="Mask tokens & cookies for safe screen-sharing"
                                >
                                    {redactSecrets ? <Icons.EyeOff size={12} /> : <Icons.Eye size={12} />}
                                    {redactSecrets ? 'Secrets Hidden' : 'Redact Secrets'}
                                </button>
                            </div>
                        </div>
                        <textarea 
                            value={curlInput} onChange={(e) => setCurlInput(e.target.value)}
                            className={`w-full p-4 outline-none resize-y min-h-[110px] font-mono text-[13px] leading-relaxed custom-scrollbar ${isDark ? 'bg-transparent text-zinc-300 placeholder-zinc-600' : 'bg-transparent text-zinc-800 placeholder-zinc-400'}`} 
                            placeholder="curl 'https://api.target.com/data' -H 'Authorization: Bearer eyJhb...' -b 'session=base64_cookie'" spellCheck="false"
                        />
                        <div className={`px-4 py-2 border-t flex justify-between items-center ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <span className="text-[11px] opacity-60">Auto-unpacks nested Base64, URL-encoded params & JWT headers locally.</span>
                            <button onClick={() => processRequest()} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-semibold py-1.5 px-4 rounded-lg transition-all active:scale-95 flex items-center gap-2 shadow-sm">
                                <Icons.Cpu size={14} /> Parse & Decode
                            </button>
                        </div>
                    </div>

                    {parsedResults && (
                        <div className="flex flex-col gap-4 animate-slide-up flex-grow overflow-auto custom-scrollbar pr-1">
                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.Link size={14} className="text-indigo-500"/> Endpoint</div>
                                <div className="p-4 font-mono text-[13px] break-words flex items-center gap-3">
                                    <span className={`px-2 py-0.5 rounded font-bold ${isDark ? 'bg-indigo-500/20 text-indigo-400' : 'bg-indigo-100 text-indigo-700'}`}>{parsedResults.method}</span>
                                    <span>{parsedResults.url}</span>
                                </div>
                            </div>
                            
                            {parsedResults.queryParams.length > 0 && (
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.Code size={14} className="text-emerald-500"/> Query Parameters</div>
                                    <div>{parsedResults.queryParams.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />)}</div>
                                </div>
                            )}
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.AlignLeft size={14} className="text-rose-500"/> Headers ({parsedResults.headers.length})</div>
                                    <div>{parsedResults.headers.length > 0 ? parsedResults.headers.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />) : <div className="p-4 text-center text-xs opacity-50">None</div>}</div>
                                </div>
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.Lock size={14} className="text-amber-500"/> Cookies ({parsedResults.cookies.length})</div>
                                    <div>{parsedResults.cookies.length > 0 ? parsedResults.cookies.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />) : <div className="p-4 text-center text-xs opacity-50">None</div>}</div>
                                </div>
                            </div>

                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.Database size={14} className="text-blue-500"/> Body Payload</div>
                                <div>
                                    {parsedResults.bodyParams.length > 0 
                                        ? parsedResults.bodyParams.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />)
                                        : parsedResults.bodyDump 
                                            ? <AnalysisRow itemKey="Raw Body Dump" analysis={parsedResults.bodyDump} />
                                            : <div className="p-4 text-center text-xs opacity-50">No body payload</div>
                                    }
                                </div>
                            </div>

                            {/* cURL to Code Converter (JS Fetch / Python Requests) */}
                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center justify-between ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}>
                                    <div className="flex items-center gap-2 font-bold text-xs uppercase tracking-wider">
                                        <Icons.FileCode size={14} className="text-emerald-500"/> Ready-to-Use Code Snippet
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className={`flex p-0.5 rounded-lg border ${isDark ? 'bg-zinc-900 border-zinc-700' : 'bg-zinc-100 border-zinc-200'}`}>
                                            <button onClick={() => setCodeLang('fetch')} className={`px-2.5 py-1 rounded-md text-[11px] font-bold ${codeLang === 'fetch' ? (isDark ? 'bg-zinc-800 text-emerald-400' : 'bg-white text-emerald-600 shadow-sm') : 'text-zinc-500'}`}>JS Fetch</button>
                                            <button onClick={() => setCodeLang('python')} className={`px-2.5 py-1 rounded-md text-[11px] font-bold ${codeLang === 'python' ? (isDark ? 'bg-zinc-800 text-emerald-400' : 'bg-white text-emerald-600 shadow-sm') : 'text-zinc-500'}`}>Python Requests</button>
                                        </div>
                                        <button onClick={() => copyToClipboard(generateCodeSnippet(), setToast)} className="p-1.5 rounded-lg border border-zinc-700/50 hover:bg-zinc-800 text-zinc-400 hover:text-white" title="Copy Code"><Icons.Copy size={14}/></button>
                                    </div>
                                </div>
                                <pre className={`p-4 font-mono text-xs overflow-x-auto m-0 ${isDark ? 'text-emerald-300' : 'text-zinc-800'}`}>
                                    {generateCodeSnippet()}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        });

        const StandardDecoderTab = memo(({ isDark, setToast, AlgorithmsLib, ws, updateWorkspace }) => {
            const { input, output, mode, category, algo, caesarShift, vigenereKey, strUtilMode, expectedHash = '' } = ws;
            const [errorMsg, setErrorMsg] = useState(null);
            const [showQR, setShowQR] = useState(false);
            const qrCanvasRef = useRef(null);

            const setInput = (val) => updateWorkspace(ws.id, { input: val });
            const setOutput = (val) => updateWorkspace(ws.id, { output: val });
            const setMode = (val) => updateWorkspace(ws.id, { mode: val });

            const detectedHint = useMemo(() => {
                if (!input || algo === 'magic') return null;
                const d = detectPayloadType(input);
                if (d && d.algo !== algo) return d;
                return null;
            }, [input, algo]);

            useEffect(() => {
                if (showQR && qrCanvasRef.current && output) {
                    try { window.QRCode.toCanvas(qrCanvasRef.current, output, { width: 180, margin: 1, color: { dark: '#000', light: '#fff' } }); } 
                    catch(e) { setToast("Payload too large for QR."); setShowQR(false); }
                }
            }, [showQR, output, setToast]);

            useEffect(() => {
                let isMounted = true;
                const process = async () => {
                    setErrorMsg(null); setShowQR(false); 
                    if (algo === 'uuid') { if (isMounted) setOutput(AlgorithmsLib.uuid()); return; }
                    if (algo === 'passgen') { if (isMounted) setOutput(AlgorithmsLib.passgen()); return; }
                    if (!input) { if(isMounted) setOutput(''); return; }
                    
                    try {
                        let res = '', effectiveMode = mode;
                        if (category === 'hashes' || algo === 'url_all') effectiveMode = 'encode';
                        if (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'epoch', 'regex_tester', 'csv2json'].includes(algo)) effectiveMode = 'decode';

                        if (category === 'hashes') { res = await AlgorithmsLib.hash(input, algo); }
                        else {
                            switch (algo) {
                                case 'magic': {
                                    const analysis = analyzeData(input, true);
                                    if (analysis.steps.length > 0) {
                                        res = JSON.stringify({
                                            Detected_Layers: analysis.steps.map(s => s.method),
                                            Final_Decoded_Payload: analysis.isJson ? JSON.parse(analysis.final) : analysis.final
                                        }, null, 4);
                                    } else {
                                        res = analysis.final;
                                    }
                                    break;
                                }
                                case 'defang': res = effectiveMode === 'encode' ? AlgorithmsLib.defang(input) : AlgorithmsLib.refang(input); break;
                                case 'base64': res = effectiveMode === 'encode' ? AlgorithmsLib.b64Encode(input) : AlgorithmsLib.b64Decode(input); break;
                                case 'base64url': res = effectiveMode === 'encode' ? AlgorithmsLib.b64UrlEncode(input) : AlgorithmsLib.b64UrlDecode(input); break;
                                case 'base32': res = effectiveMode === 'encode' ? AlgorithmsLib.b32Encode(input) : AlgorithmsLib.b32Decode(input); break;
                                case 'url': res = effectiveMode === 'encode' ? encodeURIComponent(input) : safeUrlDecode(input); break;
                                case 'url_all': res = AlgorithmsLib.urlEncodeAll(input); break;
                                case 'urlparse': res = AlgorithmsLib.urlParse(input); break;
                                case 'hex': res = effectiveMode === 'encode' ? AlgorithmsLib.toHex(input) : AlgorithmsLib.fromHex(input); break;
                                case 'binary': res = effectiveMode === 'encode' ? AlgorithmsLib.toBin(input) : AlgorithmsLib.fromBin(input); break;
                                case 'octal': res = effectiveMode === 'encode' ? AlgorithmsLib.toOctal(input) : AlgorithmsLib.fromOctal(input); break;
                                case 'html': res = effectiveMode === 'encode' ? escapeHTML(input) : AlgorithmsLib.htmlDecode(input); break;
                                case 'reverse': res = AlgorithmsLib.rev(input); break;
                                case 'atbash': res = AlgorithmsLib.atbash(input); break;
                                case 'rot47': res = AlgorithmsLib.rot47(input); break;
                                case 'caesar': res = AlgorithmsLib.caesarCipher(input, parseInt(caesarShift), effectiveMode === 'decode'); break;
                                case 'vigenere': res = AlgorithmsLib.vigenereCipher(input, vigenereKey, effectiveMode === 'decode'); break;
                                case 'morse': res = effectiveMode === 'encode' ? AlgorithmsLib.toMorse(input) : AlgorithmsLib.fromMorse(input); break;
                                case 'json': res = AlgorithmsLib.formatJSON(input, effectiveMode === 'encode'); break;
                                case 'csv2json': res = AlgorithmsLib.csv2json(input); break;
                                case 'jwt': res = AlgorithmsLib.parseJWT(input); break;
                                case 'hexdump': res = AlgorithmsLib.hexdump(input); break;
                                case 'extract_ips': res = AlgorithmsLib.extractIPs(input); break;
                                case 'extract_urls': res = AlgorithmsLib.extractURLs(input); break;
                                case 'epoch': res = AlgorithmsLib.epochConvert(input); break;
                                case 'string_utils': res = AlgorithmsLib.stringUtils(input, strUtilMode); break;
                                case 'regex_tester': res = AlgorithmsLib.regexTester(input); break;
                                default: res = input;
                            }
                        }
                        if (isMounted) setOutput(res);
                    } catch (e) { if (isMounted) { setOutput(''); setErrorMsg(e.message || 'Error processing payload.'); } }
                };
                const timeoutId = setTimeout(process, 120);
                return () => { isMounted = false; clearTimeout(timeoutId); };
            }, [input, mode, algo, category, caesarShift, vigenereKey, strUtilMode]);

            const applyJsonFormat = (type) => {
                if (!output) return;
                try {
                    const parsed = JSON.parse(output);
                    if (typeof parsed === 'object' && parsed !== null) {
                        setOutput(type === 'beautify' ? JSON.stringify(parsed, null, 4) : JSON.stringify(parsed));
                        setToast(`JSON ${type === 'beautify' ? 'Beautified ✨' : 'Minified 🗜️'}`);
                    }
                } catch(e) { setToast('Output is not valid JSON!'); }
            };

            const downloadFile = () => {
                if(output && !errorMsg) {
                    const url = URL.createObjectURL(new Blob([output], { type: "text/plain" }));
                    const a = document.createElement("a"); a.href = url; a.download = `decoderx_${algo}.txt`;
                    a.click(); URL.revokeObjectURL(url);
                }
            };

            const swap = () => {
                if(['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'uuid', 'passgen', 'epoch', 'regex_tester', 'csv2json'].includes(algo) || category === 'hashes') return;
                setInput(output); setMode(mode === 'encode' ? 'decode' : 'encode'); setShowQR(false);
            };

            const inStats = useMemo(() => getStats(input), [input]);
            const outStats = useMemo(() => getStats(output), [output]);
            const isLockMode = ['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'uuid', 'passgen', 'epoch', 'url_all', 'string_utils', 'regex_tester', 'csv2json'].includes(algo) || category === 'hashes';
            
            let isJsonOutput = false, formattedJsonOutput = '';
            if (!errorMsg && output && (output.trim().startsWith('{') || output.trim().startsWith('['))) {
                try { JSON.parse(output); isJsonOutput = true; formattedJsonOutput = output; } catch (e) {}
            }

            const getEntropyBadge = (e) => {
                const val = parseFloat(e);
                if (val === 0) return null;
                if (val < 3.5) return <span className="text-emerald-500">Low ({e})</span>;
                if (val < 5.2) return <span className="text-amber-500">Med ({e})</span>;
                return <span className="text-rose-500 font-bold">High/Compressed ({e})</span>;
            };

            const PaneHeader = ({ title, isOutput, copyVal }) => (
                <div className={`px-4 py-2 border-b flex items-center justify-between gap-2 shrink-0 ${isDark ? 'border-zinc-800 bg-zinc-800/40' : 'border-zinc-200 bg-zinc-100/50'}`}>
                    <div className="flex items-center gap-2 min-w-0">
                        <div className={`w-2 h-2 rounded-full shrink-0 ${isOutput ? (errorMsg ? 'bg-red-500' : 'bg-indigo-500') : 'bg-emerald-500'}`}></div>
                        <span className="text-xs font-bold uppercase tracking-wider shrink-0">{title}</span>
                        {isOutput && errorMsg && <span className="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-red-500/20 text-red-500">ERROR</span>}
                        {!isOutput && detectedHint && (
                            <button
                                onClick={() => {
                                    updateWorkspace(ws.id, { category: detectedHint.category, algo: detectedHint.algo, mode: detectedHint.mode });
                                    setToast(`Switched to ${detectedHint.label}! ✨`);
                                }}
                                className="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500 hover:text-white transition-all flex items-center gap-1 truncate animate-fade-in"
                                title="Click to automatically switch to the detected tool"
                            >
                                <Icons.Wand size={10} /> {detectedHint.label} — Switch
                            </button>
                        )}
                    </div>
                    <div className="flex items-center gap-1.5 shrink-0">
                        {!isOutput && SAMPLE_PAYLOADS[algo] && (
                            <button
                                onClick={() => {
                                    updateWorkspace(ws.id, { input: SAMPLE_PAYLOADS[algo], mode: ['hashes'].includes(category) || ['url_all'].includes(algo) ? 'encode' : 'decode' });
                                    setToast('Sample payload loaded! ⚡');
                                }}
                                className={`px-2 py-0.5 rounded text-[10px] font-bold border transition-all flex items-center gap-1 ${
                                    isDark ? 'bg-amber-500/10 border-amber-500/30 text-amber-400 hover:bg-amber-500/20' : 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100'
                                }`}
                                title="Load a realistic sample payload for this tool"
                            >
                                <Icons.Zap size={10} /> Sample
                            </button>
                        )}
                        {isOutput && ['uuid', 'passgen'].includes(algo) && (
                            <button
                                onClick={() => setOutput(algo === 'uuid' ? AlgorithmsLib.uuid() : AlgorithmsLib.passgen())}
                                className={`px-2 py-0.5 rounded text-[10px] font-bold border transition-all ${
                                    isDark ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                                }`}
                            >
                                Regenerate ↻
                            </button>
                        )}
                        {isOutput && !errorMsg && output && (
                            <>
                                <button onClick={()=>setShowQR(!showQR)} className={`p-1 rounded transition-colors ${showQR ? 'bg-zinc-700 text-white' : 'hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-500 dark:text-zinc-400'}`} title="Client-Side QR Code"><Icons.QrCode size={14}/></button>
                                <button onClick={downloadFile} className="p-1 rounded transition-colors hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-500 dark:text-zinc-400" title="Download Output"><Icons.Download size={14}/></button>
                                <div className={`w-px h-3 mx-1 ${isDark ? 'bg-zinc-700' : 'bg-zinc-300'}`}></div>
                            </>
                        )}
                        <button onClick={()=>copyToClipboard(copyVal, setToast)} disabled={!copyVal} className="p-1 rounded transition-colors hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-500 dark:text-zinc-400 disabled:opacity-30" title="Copy to Clipboard"><Icons.Copy size={14}/></button>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col lg:flex-row h-full gap-4 pb-2 animate-fade-in w-full min-h-[600px] lg:min-h-0">
                    
                    {/* INPUT PANE */}
                    <div className="app-panel flex flex-col flex-1 h-full min-h-[250px] overflow-hidden">
                        <PaneHeader title="Input Payload" isOutput={false} copyVal={input} />
                        <HighlightedInput value={input} onChange={e => setInput(e.target.value)} isDark={isDark} placeholder={algo === 'regex_tester' ? "/pattern/gi\n---\ntest string" : "Paste any payload here, or click '⚡ Sample' to test..."} />
                        <div className={`px-4 py-1.5 text-[10px] font-mono border-t flex justify-between items-center shrink-0 ${isDark ? 'border-zinc-800 text-zinc-500' : 'border-zinc-200 text-zinc-400'}`}>
                            <span>Ln: {inStats.lines} | Wd: {inStats.words} | Ch: {inStats.chars}</span>
                            <span className="flex items-center gap-3">
                                {inStats.chars > 0 && <span>Entropy: {getEntropyBadge(inStats.entropy)}</span>}
                                <span>{inStats.bytes} B</span>
                            </span>
                        </div>
                    </div>

                    {/* ACTION TOOLBAR */}
                    <div className="flex flex-row lg:flex-col items-center justify-center gap-2 shrink-0 p-1">
                        <button onClick={() => applyJsonFormat('beautify')} className={`p-2 rounded-lg transition-all ${isDark ? 'bg-zinc-800 text-zinc-400 hover:text-emerald-400 hover:bg-zinc-700' : 'bg-white text-zinc-500 hover:text-emerald-600 shadow-sm border border-zinc-200'}`} title="Format / Beautify JSON"><Icons.AlignLeft size={16} /></button>
                        
                        <button onClick={swap} disabled={isLockMode} className={`p-3 rounded-full transition-all shadow-md group ${isLockMode ? 'opacity-30 cursor-not-allowed' : ''} ${isDark ? 'bg-zinc-800 text-zinc-300 hover:text-white border border-zinc-700 hover:border-emerald-500' : 'bg-zinc-800 text-white hover:bg-zinc-900 border border-zinc-700'}`} title="Swap Input & Output">
                            <Icons.ArrowRightLeft size={16} className="transition-transform group-hover:scale-110" />
                        </button>
                        
                        <button onClick={() => applyJsonFormat('minify')} className={`p-2 rounded-lg transition-all ${isDark ? 'bg-zinc-800 text-zinc-400 hover:text-indigo-400 hover:bg-zinc-700' : 'bg-white text-zinc-500 hover:text-indigo-600 shadow-sm border border-zinc-200'}`} title="Minify JSON"><Icons.FileCode size={16} /></button>
                    </div>

                    {/* OUTPUT PANE */}
                    <div className={`app-panel flex flex-col flex-1 h-full min-h-[250px] overflow-hidden ${errorMsg ? (isDark ? 'border-red-900/50' : 'border-red-300') : ''}`}>
                        <PaneHeader title="Processed Output" isOutput={true} copyVal={output} />
                        {category === 'hashes' && output && (
                            <div className={`px-4 py-1.5 border-b flex items-center gap-2 text-xs ${isDark ? 'bg-zinc-900/90 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                <span className="text-[10px] font-bold uppercase tracking-wider opacity-60 shrink-0">Verify Hash:</span>
                                <input
                                    type="text"
                                    value={expectedHash}
                                    onChange={e => updateWorkspace(ws.id, { expectedHash: e.target.value })}
                                    placeholder="Paste expected hash to compare..."
                                    className="bg-transparent font-mono text-xs outline-none flex-grow"
                                />
                                {expectedHash.trim() && (
                                    expectedHash.trim().toLowerCase() === output.trim().toLowerCase()
                                        ? <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shrink-0">✓ MATCH</span>
                                        : <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 shrink-0">✗ MISMATCH</span>
                                )}
                            </div>
                        )}
                        <div className="editor-container relative">
                            {isJsonOutput ? (
                                <div className="absolute inset-0 overflow-auto custom-scrollbar">
                                    <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(formattedJsonOutput) }} className={`m-0 p-4 font-mono text-[13px] leading-[1.6] whitespace-pre-wrap break-all ${isDark ? 'text-zinc-300' : 'text-zinc-700'}`}></pre>
                                </div>
                            ) : (
                                <textarea value={errorMsg || output} readOnly placeholder="Processed result will appear here..." className={`absolute inset-0 w-full h-full p-4 resize-none outline-none font-mono text-[13px] leading-[1.6] custom-scrollbar bg-transparent ${errorMsg ? 'text-red-500' : (isDark ? 'text-zinc-300' : 'text-zinc-800')}`} />
                            )}
                            
                            {showQR && (
                                <div className="absolute inset-0 z-20 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fade-in">
                                    <div className="bg-white p-3 rounded-xl shadow-2xl relative">
                                        <button onClick={()=>setShowQR(false)} className="absolute -top-2 -right-2 p-1 bg-zinc-800 text-white rounded-full shadow hover:bg-red-500"><Icons.X size={12}/></button>
                                        <canvas ref={qrCanvasRef}></canvas>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className={`px-4 py-1.5 text-[10px] font-mono border-t flex justify-between items-center shrink-0 ${isDark ? 'border-zinc-800 text-zinc-500' : 'border-zinc-200 text-zinc-400'}`}>
                            <span>Ln: {outStats.lines} | Wd: {outStats.words} | Ch: {outStats.chars}</span>
                            <span className="flex items-center gap-3">
                                {outStats.chars > 0 && <span>Entropy: {getEntropyBadge(outStats.entropy)}</span>}
                                <span>{outStats.bytes} B</span>
                            </span>
                        </div>
                    </div>

                </div>
            );
        });

        const WorkspaceTab = memo(({ ws, isActive, onSelect, onClose, onRename, isDark, isOnlyTab }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editName, setEditName] = useState(ws.name);
            const inputRef = useRef(null);

            useEffect(() => { if (isEditing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [isEditing]);

            const handleRenameSubmit = () => {
                setIsEditing(false);
                if (editName.trim() && editName.trim() !== ws.name) onRename(ws.id, editName.trim());
                else setEditName(ws.name);
            };
            const handleKeyDown = (e) => { if (e.key === 'Enter') handleRenameSubmit(); if (e.key === 'Escape') { setIsEditing(false); setEditName(ws.name); } };

            return (
                <div 
                    onClick={() => !isEditing && onSelect(ws.id)} onDoubleClick={() => setIsEditing(true)}
                    className={`group flex items-center gap-2 px-3 py-1.5 min-w-[120px] max-w-[200px] cursor-pointer rounded-t-lg transition-all border-t border-x shrink-0 relative ${
                        isActive 
                            ? (isDark ? 'bg-zinc-900 border-zinc-700 text-emerald-400 z-10' : 'bg-white border-zinc-300 text-emerald-600 z-10') 
                            : (isDark ? 'bg-zinc-800/50 border-transparent text-zinc-500 hover:bg-zinc-800 hover:text-zinc-300' : 'bg-zinc-100 border-transparent text-zinc-500 hover:bg-zinc-200 hover:text-zinc-700')
                    }`}
                    style={{ marginBottom: isActive ? '-1px' : '0', borderBottomColor: isActive ? (isDark?'#18181b':'#ffffff') : 'transparent' }}
                >
                    <Icons.FileCode size={12} className={`shrink-0 ${isActive ? '' : 'opacity-60'}`} />
                    {isEditing ? (
                        <input ref={inputRef} type="text" value={editName} onChange={(e) => setEditName(e.target.value)} onBlur={handleRenameSubmit} onKeyDown={handleKeyDown} className="text-[11px] font-semibold w-full bg-transparent outline-none flex-grow text-emerald-500" />
                    ) : (
                        <span className="text-[11px] font-semibold truncate flex-grow select-none" title="Double-click to rename tab">{ws.name}</span>
                    )}
                    {!isOnlyTab && !isEditing && (
                        <button onClick={(e) => { e.stopPropagation(); onClose(ws.id); }} className="p-0.5 rounded opacity-0 group-hover:opacity-100 hover:bg-red-500 hover:text-white transition-all"><Icons.X size={10} /></button>
                    )}
                </div>
            );
        });

        const utf8Encoder = new TextEncoder();
        const utf8Decoder = new TextDecoder('utf-8', { fatal: false });

        const algosLib = {
            toHex: s => Array.from(utf8Encoder.encode(s)).map(b => b.toString(16).padStart(2,'0')).join(' '),
            fromHex: h => { 
                let clean = h.replace(/\s|0x|,|;/g, '');
                if (clean.length % 2 !== 0) throw new Error("Invalid Hex String (Odd length)");
                if (!/^[0-9a-fA-F]*$/.test(clean)) throw new Error("Invalid Hex Characters");
                let bytes = new Uint8Array(clean.length / 2);
                for(let i=0; i<clean.length; i+=2) bytes[i/2] = parseInt(clean.substr(i,2), 16);
                return utf8Decoder.decode(bytes);
            },
            toBin: s => Array.from(utf8Encoder.encode(s)).map(b => b.toString(2).padStart(8,'0')).join(' '),
            fromBin: b => { 
                let clean = b.replace(/[^01]/g, ''); 
                if(clean.length % 8 !== 0) throw new Error("Invalid Binary String (Not a multiple of 8 bits)");
                let bytes = new Uint8Array(clean.length / 8);
                for(let i=0; i<clean.length; i+=8) bytes[i/8] = parseInt(clean.substr(i,8), 2);
                return utf8Decoder.decode(bytes);
            },
            toOctal: s => Array.from(utf8Encoder.encode(s)).map(b => '\\' + b.toString(8).padStart(3, '0')).join(''),
            fromOctal: s => {
                const parts = s.split('\\').filter(Boolean);
                let bytes = new Uint8Array(parts.length);
                for(let i=0; i<parts.length; i++) {
                    let p = parts[i].trim();
                    if(!/^[0-7]{1,3}$/.test(p)) throw new Error("Invalid Octal formatting (Use \\nnn)");
                    bytes[i] = parseInt(p, 8);
                }
                return utf8Decoder.decode(bytes);
            },
            htmlDecode: s => new DOMParser().parseFromString(s,'text/html').documentElement.textContent,
            rev: s => Array.from(s).reverse().join(''),
            atbash: s => s.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 + 65 : 122 + 97) - c.charCodeAt(0))),
            rot47: s => s.replace(/[!-~]/g, c => String.fromCharCode((c.charCodeAt(0) - 33 + 47) % 94 + 33)),
            defang: s => s.replace(/\./g, '[.]').replace(/http/gi, 'hxxp'),
            refang: s => s.replace(/\[\.\]/g, '.').replace(/hxxp/gi, 'http'),
            caesarCipher: (str, shift, dec) => str.replace(/[a-zA-Z]/g, c => String.fromCharCode(((c.charCodeAt(0)-(c<='Z'?65:97)+(dec?(26-(shift%26)):(shift%26)))%26)+(c<='Z'?65:97))),
            vigenereCipher: (str, key, dec) => { 
                let k=key.toUpperCase().replace(/[^A-Z]/g,'')||'A', ki=0; 
                return str.replace(/[a-zA-Z]/g, c => { 
                    const shift = k.charCodeAt(ki%k.length)-65; ki++; 
                    return String.fromCharCode(((c.charCodeAt(0)-(c<='Z'?65:97)+(dec?(26-shift):shift))%26)+(c<='Z'?65:97));
                }); 
            },

            parseJWT: t => {

                        for(let i=0; i<binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        return utf8Decoder.decode(bytes);
                    }; 
                    const header = JSON.parse(dec(p[0]));
                    const payload = JSON.parse(dec(p[1]));
                    const sigInfo = p.length === 3 ? "Present (Verification requires secret/key)" : "None";
                    
                    let notes = [];
                    const now = Math.floor(Date.now() / 1000);
                    if(payload.exp) { notes.push(`Expires: ${new Date(payload.exp*1000).toISOString()} (${payload.exp < now ? 'EXPIRED' : 'Valid'})`); }

                    return JSON.stringify({Header: header, Payload: payload, Signature: sigInfo, Security_Notes: notes.length ? notes : "None"}, null, 4); 
                } catch(e){ throw new Error("Invalid or Corrupted JWT: " + e.message); } 
            },
            b64Encode: (str) => {
                const bytes = utf8Encoder.encode(str);
                let binStr = "";
                for(let i=0; i<bytes.byteLength; i++) binStr += String.fromCharCode(bytes[i]);

            b64Decode: (b64) => {
                b64 = b64.replace(/\s+/g, '');
                if (!/^[A-Za-z0-9+/]*={0,2}$/.test(b64) || b64.length % 4 !== 0) throw new Error("Invalid Base64 formatting");
                const binStr = atob(b64);
                const bytes = new Uint8Array(binStr.length);

                while (b.length % 4) b += '=';

            b32Encode: (s) => { 
                const bytes = utf8Encoder.encode(s);
                let bits = 0, value = 0, output = ''; 
                for (let i = 0; i < bytes.length; i++) { 
                    value = (value << 8) | bytes[i]; bits += 8; 
                    while (bits >= 5) { output += "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[(value >>> (bits - 5)) & 31]; bits -= 5; } 
                } 
                if (bits > 0) output += "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[(value << (5 - bits)) & 31]; 
                while (output.length % 8 !== 0) output += '='; 
                return output; 
            },
            b32Decode: (s) => { 
                s = s.replace(/=+$/, '').toUpperCase().replace(/\s+/g, ''); 
                let bits = 0, value = 0;

                for (let i = 0; i < s.length; i++) { 
                    let val = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(s[i]); 
                    if (val === -1) throw new Error("Invalid Base32 char"); 
                    value = (value << 5) | val; bits += 5; 
                    if (bits >= 8) { bytes.push((value >>> (bits - 8)) & 255); bits -= 8; } 
                } 
                return utf8Decoder.decode(new Uint8Array(bytes)); 
            },
            extractIPs: (s) => { 
                const ipv4 = s.match(/\b(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b/g) || []; 
                const ipv6 = s.match(/\b(?:[a-fA-F0-9]{1,4}:){7}[a-fA-F0-9]{1,4}\b/g) || []; 
                const all = [...new Set([...ipv4, ...ipv6])]; 
                return all.length ? all.join('\n') : 'No IPs found.'; 
            },
            extractURLs: (s) => { 
                const urls = s.match(/https?:\/\/[^\s"'<>]+/gi) || []; 
                return urls.length ? [...new Set(urls)].join('\n') : 'No URLs found.'; 
            },
            hexdump: (s) => { 
                const bytes = utf8Encoder.encode(s);
                let out = ''; 
                for (let i = 0; i < bytes.length; i += 16) { 
                    let chunk = bytes.slice(i, i + 16); 
                    let hex = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join(' '); 
                    let ascii = Array.from(chunk).map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join(''); 
                    out += i.toString(16).padStart(8, '0') + '  ' + hex.padEnd(48, ' ') + '  |' + ascii + '|\n'; 
                } 
                return out || 'No data.'; 
            },
            epochConvert: (s) => { 
                s = s.trim(); 
                if(!/^-?\d+(\.\d+)?$/.test(s)) throw new Error("Invalid Unix Timestamp format"); 
                let num = parseFloat(s);
                let ms = num < 10000000000 ? num * 1000 : num;
                let d = new Date(ms);
                if(isNaN(d.getTime())) throw new Error("Date out of range");
                return `UTC:   ${d.toUTCString()}\nLocal: ${d.toString()}\nISO:   ${d.toISOString()}`; 
            },
            urlEncodeAll: (s) => {
                return Array.from(utf8Encoder.encode(s)).map(b => '%' + b.toString(16).padStart(2, '0').toUpperCase()).join('');

                try {
                    const u = new URL(s.startsWith('http') ? s : `https://${s}`); 
                    return JSON.stringify({ 
                        Protocol: u.protocol.replace(':',''), 
                        Host: u.host, 
                        Port: u.port || (u.protocol === 'https:' ? '443' : '80'),
                        Path: u.pathname, 
                        Hash: u.hash,
                        Parameters: Object.keys(Object.fromEntries(u.searchParams)).length ? Object.fromEntries(u.searchParams) : "None" 
                    }, null, 4);
                } catch(e) { throw new Error("Invalid URL Format"); }
            },
            stringUtils: (s, mode) => { 
                if(mode === 'upper') return s.toUpperCase(); 
                if(mode === 'lower') return s.toLowerCase(); 
                return s.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substring(1).toLowerCase()); 
            },
            uuid: () => {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
                if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
                    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                    );
                }
                throw new Error("Secure random generation is not supported in this environment context.");
            },
            passgen: () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+';
                const hexChars = '0123456789abcdef';
                const rand = new Uint32Array(64);
                crypto.getRandomValues(rand);
                const pass24 = Array.from(rand.slice(0, 24)).map(n => chars[n % chars.length]).join('');
                const apiKey32 = 'dx_live_' + Array.from(rand.slice(24, 56)).map(n => hexChars[n % 16]).join('');
                return JSON.stringify({
                    Strong_Password_24_Chars: pass24,
                    API_Secret_Token: apiKey32,
                    UUID_v4: algosLib.uuid()

            },

                if(typeof crypto === 'undefined' || !crypto.subtle) throw new Error("Web Crypto API unavailable. Requires HTTPS/Localhost.");
                const name = algo === 'sha512' ? 'SHA-512' : algo === 'sha1' ? 'SHA-1' : 'SHA-256';
                const hashBuffer = await crypto.subtle.digest(name, utf8Encoder.encode(s));

            regexTester: (s) => {
                let parts = s.split('\n---\n');
                if(parts.length < 2) throw new Error("Format must be:\n/pattern/flags\n---\nTarget string");
                let patternStr = parts[0].trim();
                let target = parts.slice(1).join('\n---\n');
                
                let m = patternStr.match(/^\/(.*?)\/([a-z]*)$/i);
                if(!m) throw new Error("Invalid Regex format. Use /pattern/flags");
                
                let regex = new RegExp(m[1], m[2]);
                let results = [], match;
                
                if (!regex.global) {
                    let r = regex.exec(target);
                    if(r) return JSON.stringify({ matches: [r[0]], captureGroups: r.slice(1), index: r.index }, null, 2);
                    return "No Match Found.";
                }

                while ((match = regex.exec(target)) !== null) {
                    results.push({ match: match[0], captureGroups: match.slice(1), index: match.index });
                    if(match.index === regex.lastIndex) regex.lastIndex++;
                }
                return results.length ? JSON.stringify(results, null, 2) : "No Matches Found.";
            },
            csv2json: (s) => {
                let lines = s.trim().split('\n');
                if(lines.length < 2) throw new Error("CSV must have a header row and data.");
                let headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
                let res = [];
                for(let i=1; i<lines.length; i++) {

                        obj[headers[j]] = currentLine[j] ? currentLine[j].trim().replace(/^"|"$/g,'') : '';
                    }
                    res.push(obj);
                }

                        const key = rec?.deviceId || rec?.identityKey || rec?.userId;
                        if (key && rec.lastSeen && (now - rec.lastSeen < ACTIVE_TTL)) {
                            mergedMap.set(key, {
                                deviceId: key,

                                deviceType: rec.deviceType || 'Device',
                                lastSeen: rec.lastSeen
                            });
                        }
                    });

                    peerRegistry.forEach((rec, key) => {

                            const existing = mergedMap.get(key);
                            if (!existing || rec.lastSeen > existing.lastSeen) {
                                mergedMap.set(key, rec);
                            }
                        } else {
                            peerRegistry.delete(key);
                        }

                            userId: currentAuthUser?.uid || myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,

                        if (!isMounted) return;

                            globalWs.onopen = () => {
                                publishGlobalSignal('join');

                                    const outer = JSON.parse(ev.data);

                                    const eventTimeMs = outer.time ? outer.time * 1000 : Date.now();
                                    if (Date.now() - eventTimeMs > ACTIVE_TTL) return;

                                    const data = JSON.parse(outer.message);

                                        peerRegistry.delete(data.deviceId);
                                        recalculateLiveCount(myNodeId);

                                    }

                                    peerRegistry.set(data.deviceId, {
                                        deviceId: data.deviceId,
                                        userId: data.userId || data.deviceId,
                                        ipMasked: data.ipMasked || 'Remote',
                                        deviceType: data.deviceType || 'Device',
                                        lastSeen: Date.now()

                                    if (data.type === 'join' && data.deviceId !== myNodeId) {

                                                if (isMounted) publishGlobalSignal('here');
                                            }, 150 + Math.floor(Math.random() * 400));

                    // Local BroadcastChannel sync across same-browser tabs
                    try {
                        bc = new BroadcastChannel('decoderx_live_presence_v4');
                        bc.postMessage({
                            type: 'ping',
                            deviceId: myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            ts: Date.now()
                        });
                        bc.onmessage = (ev) => {
                            if (ev.data && ev.data.deviceId) {
                                if (ev.data.type === 'leave') {
                                    peerRegistry.delete(ev.data.deviceId);
                                } else {
                                    peerRegistry.set(ev.data.deviceId, {
                                        deviceId: ev.data.deviceId,
                                        userId: ev.data.userId || ev.data.deviceId,
                                        ipMasked: ev.data.ipMasked || clientMeta.ipMasked,
                                        deviceType: ev.data.deviceType || clientMeta.deviceType,
                                        lastSeen: Date.now()
                                    });
                                }
                                recalculateLiveCount(myNodeId);
                            }
                        };
                    } catch (e) {}

                    // Cloud Firestore Real-Time Presence (using unique myNodeId per device so devices on same account don't overwrite each other)
                    const sdk = window.__DX_FIREBASE_SDK__;
                    if (sdk && typeof __firebase_config !== 'undefined' && __firebase_config) {
                        try {
                            const firebaseConfig = JSON.parse(__firebase_config);
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                            const app = sdk.initializeApp(firebaseConfig);
                            const auth = sdk.getAuth(app);
                            const db = sdk.getFirestore(app);

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await sdk.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await sdk.signInAnonymously(auth);
                            }

                            const user = auth.currentUser;
                            if (user && isMounted) {
                                currentAuthUser = user;
                                setCurrentUserId(`${myNodeId} (${user.uid})`);

                                // Keyed by myNodeId so every device gets its own document in active_users
                                userDocRef = sdk.doc(db, 'artifacts', appId, 'public', 'data', 'active_users', myNodeId);
                                const usersColRef = sdk.collection(db, 'artifacts', appId, 'public', 'data', 'active_users');

                                const pushFirestoreHeartbeat = async () => {
                                    if (!currentAuthUser) return;
                                    try {
                                        await sdk.setDoc(userDocRef, {
                                            deviceId: myNodeId,
                                            userId: currentAuthUser.uid,
                                            identityKey: myNodeId,
                                            ipMasked: clientMeta.ipMasked,
                                            deviceType: clientMeta.deviceType,
                                            lastSeen: Date.now()
                                        });
                                    } catch (err) {}
                                };

                                await pushFirestoreHeartbeat();

                                unsubscribeSnapshot = sdk.onSnapshot(
                                    usersColRef,
                                    (snapshot) => {
                                        const list = [];
                                        snapshot.forEach(d => list.push(d.data()));
                                        activeRecordsRef.current = list;
                                        recalculateLiveCount(myNodeId);
                                    },
                                    (err) => {}
                                );
                            }
                        } catch (e) {}
                    }

                    // Periodic heartbeat across all channels
                    heartbeatTimer = setInterval(() => {
                        registerSelfLocally();
                        publishGlobalSignal('ping');
                        if (bc) {
                            try {
                                bc.postMessage({
                                    type: 'ping',
                                    deviceId: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    ts: Date.now()
                                });
                            } catch (e) {}
                        }
                        if (userDocRef && currentAuthUser && window.__DX_FIREBASE_SDK__) {
                            try {
                                window.__DX_FIREBASE_SDK__.setDoc(userDocRef, {
                                    deviceId: myNodeId,
                                    userId: currentAuthUser.uid,
                                    identityKey: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    lastSeen: Date.now()
                                });
                            } catch (e) {}
                        }
                    }, 22000);

                    pruneTimer = setInterval(() => recalculateLiveCount(myNodeId), 8000);

                    const handleVisibility = () => {
                        if (document.visibilityState === 'visible') {
                            registerSelfLocally();
                            publishGlobalSignal('join');
                        }
                    };
                    document.addEventListener('visibilitychange', handleVisibility);

                    const handleUnload = () => {
                        try {
                            if (navigator.sendBeacon) {
                                navigator.sendBeacon(
                                    `https://ntfy.sh/${GLOBAL_TOPIC}`,
                                    JSON.stringify({ type: 'leave', deviceId: myNodeId, ts: Date.now() })
                                );
                            }
                        } catch (e) {}
                        if (bc) {
                            try { bc.postMessage({ type: 'leave', deviceId: myNodeId }); } catch (e) {}
                        }
                        if (userDocRef && currentAuthUser && window.__DX_FIREBASE_SDK__) {
                            try { window.__DX_FIREBASE_SDK__.deleteDoc(userDocRef); } catch (e) {}
                        }
                    };
                    window.addEventListener('pagehide', handleUnload);
                    window.addEventListener('beforeunload', handleUnload);
                };

                if (window.__DX_FIREBASE_SDK__) {
                    initLivePresence();
                } else {
                    window.addEventListener('dx-firebase-ready', initLivePresence, { once: true });
                }

                return () => {
                    isMounted = false;
                    if (heartbeatTimer) clearInterval(heartbeatTimer);
                    if (pruneTimer) clearInterval(pruneTimer);
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                    if (globalWs) {
                        try { globalWs.close(); } catch (e) {}
                    }
                    if (userDocRef && currentAuthUser && window.__DX_FIREBASE_SDK__) {
                        try { window.__DX_FIREBASE_SDK__.deleteDoc(userDocRef); } catch (e) {}
                    }
                    if (bc) {
                        try { bc.close(); } catch (e) {}
                    }
                };
            }, []);

            useEffect(() => { 
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setIsCmdOpen(prev => !prev);
                    }
                    if (e.key === 'Escape') {
                        setIsCmdOpen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(null), 3000);
                return () => clearTimeout(timer);
            }, [toast]);

            const isDark = theme === 'dark';

            const addWorkspace = () => {
                if (workspaces.length >= 10) return setToast("Max 10 tabs allowed");
                const newId = nextWorkspaceId;
                setWorkspaces([...workspaces, { id: newId, name: `Tab ${newId}`, input: '', output: '', mode: 'decode', category: 'encoders', algo: 'base64', caesarShift: 13, vigenereKey: 'KEY', strUtilMode: 'upper', expectedHash: '' }]);
                setActiveWorkspaceId(newId); setNextWorkspaceId(newId + 1);
            };

            const removeWorkspace = (id) => {
                if (workspaces.length === 1) { updateWorkspace(id, { input: '', output: '' }); return; }
                const updated = workspaces.filter(ws => ws.id !== id);
                setWorkspaces(updated);
                if (activeWorkspaceId === id) setActiveWorkspaceId(updated[updated.length - 1].id);
            };

            const renameWorkspace = (id, newName) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, name: newName } : w));
            const updateWorkspace = useCallback((id, updates) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, ...updates } : w)), []);
            
            const activeWs = workspaces.find(w => w.id === activeWorkspaceId);
            const activeAlgoObj = algorithms.find(a => a.id === activeWs?.algo);

            const handleGlobalFileLoad = (e) => {
                const f = e.target.files[0]; if (!f) return;
                if(f.size > 1024 * 1024 * 5) return setToast("File too large (Max 5MB)");
                const reader = new FileReader();
                reader.onload = (ev) => { 
                    if(activeTab === 'decoderx') updateWorkspace(activeWorkspaceId, {input: ev.target.result});
                    else setCurlInput(ev.target.result);
                    setToast(`Loaded: ${f.name}`); 
                };
                reader.readAsText(f); e.target.value = null; 
            };

            const handleGlobalClear = () => {
                if(activeTab === 'decoderx') updateWorkspace(activeWorkspaceId, {input: '', output: '', expectedHash: ''});

                setToast("Workspace Cleared");
            };

            const handleSelectToolFromPalette = (tool) => {

                updateWorkspace(activeWorkspaceId, {
                    category: tool.category,

                    mode: (tool.category === 'hashes' || ['uuid', 'passgen', 'url_all'].includes(tool.id)) ? 'encode' : (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'epoch', 'regex_tester', 'csv2json'].includes(tool.id) ? 'decode' : activeWs.mode)
