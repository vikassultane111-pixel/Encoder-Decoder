    <style>
        :root {
            /* Light Theme Variables */
            --app-bg: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --editor-bg: #ffffff;
        }
        html.dark {
            /* Dark Theme Variables (Enterprise IDE style) */
            --app-bg: #020617;
            --panel-bg: #0f172a;
            --border-color: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --editor-bg: #0f172a;
            color-scheme: dark; 
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--app-bg);
            color: var(--text-primary);
            transition: background-color 0.15s, color 0.15s;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* IDE Style Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 4px; border: 2px solid var(--panel-bg); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
        .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.6); border: 2px solid var(--panel-bg); }
        .dark ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.9); }

        .app-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem; /* sharper, more professional radius */
            box-shadow: var(--shadow-panel);
        }

        /* High-Precision Synchronized Syntax Highlighting Overlay */
        .editor-container {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            background-color: var(--editor-bg);
        }
        .editor-textarea, .editor-pre {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            font-variant-ligatures: none !important;
            line-height: 1.5 !important;
            letter-spacing: 0px !important;
            tab-size: 4 !important;
            padding: 1rem !important;
            margin: 0 !important;
            border: none !important;
            width: 100% !important;
            height: 100% !important;
            box-sizing: border-box !important;
            overflow-y: auto !important;
        }
        .wrap-enabled {
            white-space: pre-wrap !important;
            word-break: break-all !important;
            overflow-wrap: break-word !important;
            overflow-x: hidden !important;
        }
        .wrap-disabled {
            white-space: pre !important;
            word-break: normal !important;
            overflow-wrap: normal !important;
            overflow-x: auto !important;
        }
        
        .editor-textarea {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            color: transparent !important;
            background: transparent !important;
            caret-color: var(--accent) !important;
            resize: none;
            z-index: 10;
        }
        .editor-textarea.plain-mode {
            color: var(--text-primary) !important;
        }
        
        .editor-textarea::selection { background: rgba(59, 130, 246, 0.2); color: transparent; }
        .dark .editor-textarea::selection { background: rgba(59, 130, 246, 0.3); color: transparent; }
        .editor-textarea.plain-mode::selection { background: rgba(59, 130, 246, 0.2); color: inherit; }
        .dark .editor-textarea.plain-mode::selection { background: rgba(59, 130, 246, 0.3); color: inherit; }

        .editor-pre {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            color: var(--text-primary);
        }

        /* IDE Style Syntax Highlighting */
        .json-key { color: #005cc5; } .dark .json-key { color: #79c0ff; }
        .json-string { color: #22863a; } .dark .json-string { color: #7ee787; }
        .json-number { color: #005cc5; } .dark .json-number { color: #79c0ff; }
        .json-boolean { color: #d73a49; } .dark .json-boolean { color: #ff7b72; }
        .json-bracket { color: #6a737d; } .dark .json-bracket { color: #8b949e; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-scroll::-webkit-scrollbar { height: 3px; }

        *:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
        textarea:focus, input:focus, select:focus { outline: none; }
        
        /* Modern segmented control style for toggles */
        .segmented-btn {
            position: relative;
            transition: all 0.2s ease;
        }
    </style>
</head>

                    result += `<span class="json-number">${escapeHTML(token)}</span>`;
                }
                lastIndex = tokenRegex.lastIndex;
            }

            if (lastIndex < jsonStr.length) {
                result += escapeHTML(jsonStr.slice(lastIndex));
            }
            return result;
        }

        const detectPayloadType = (str) => {
            if (!str || typeof str !== 'string') return null;
            const s = str.trim();
            if (s.length < 4) return null;
            if (/^H4sI/.test(s)) {
                return { algo: 'gzip', category: 'encoders', mode: 'decode', label: 'Gzip Base64' };
            }
            if (/^DX_AES1:[A-Za-z0-9+/=]+:[A-Za-z0-9+/=]+:[A-Za-z0-9+/=]+$/.test(s)) {
                return { algo: 'aes_gcm', category: 'ciphers', mode: 'decode', label: 'AES-GCM Ciphertext' };
            }
            if (/^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*$/.test(s)) {
                return { algo: 'jwt', category: 'parsers', mode: 'decode', label: 'JWT Token' };
            }
            if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
                try { JSON.parse(s); return { algo: 'json', category: 'parsers', mode: 'decode', label: 'JSON Data' }; } catch(e) {}
            }
            if (/^\b(?:25[0-5]|2[0-4]\d|[01]?\d\d?)(?:\.(?:25[0-5]|2[0-4]\d|[01]?\d\d?)){3}\/(?:[0-9]|[12][0-9]|3[0-2])\b$/.test(s)) {
                return { algo: 'cidr', category: 'network', mode: 'decode', label: 'IPv4 CIDR' };
            }
            if (/^hxxps?:\/\//i.test(s) || s.includes('[.]')) {
                return { algo: 'defang', category: 'network', mode: 'decode', label: 'Defanged Data' };
            }
            if (/^https?:\/\/[^\s]+$/i.test(s) && (s.includes('?') || s.includes('&') || s.includes(':'))) {
                return { algo: 'urlparse', category: 'parsers', mode: 'decode', label: 'URL Format' };
            }
            if (/^\d{10}(\d{3})?$/.test(s)) {
                return { algo: 'epoch', category: 'utilities', mode: 'decode', label: 'Unix Epoch' };
            }
            if (/^(?:\\u[0-9a-fA-F]{4}){2,}/.test(s)) {
                return { algo: 'unicode', category: 'encoders', mode: 'decode', label: 'Unicode Escape' };
            }
            if (/^[01]{8}(\s+[01]{8})+$/.test(s)) {
                return { algo: 'binary', category: 'encoders', mode: 'decode', label: 'Binary Stream' };
            }
            if (/^([0-9a-fA-F]{2}\s+){3,}[0-9a-fA-F]{2}$/.test(s) || (/^[0-9a-fA-F]{16,}$/.test(s) && s.length % 2 === 0 && !/[g-zG-Z]/.test(s))) {
                return { algo: 'hex', category: 'encoders', mode: 'decode', label: 'Hexadecimal' };
            }
            if (/%[0-9A-Fa-f]{2}/.test(s)) {
                return { algo: 'url', category: 'encoders', mode: 'decode', label: 'URL Encoding' };
            }
            if (/&(?:lt|gt|quot|amp|#0*39|#x0*27);/i.test(s)) {
                return { algo: 'html', category: 'encoders', mode: 'decode', label: 'HTML Entities' };
            }
            if (/^[A-Za-z0-9+/]{8,}={0,2}$/.test(s) && s.length % 4 === 0 && !s.includes(' ')) {
                return { algo: 'base64', category: 'encoders', mode: 'decode', label: 'Base64' };
            }
            return null;
        };

        const getEntropy = (str) => {
            if (!str) return '0.00';
            const len = str.length;
            const frequencies = Array.from(str).reduce((freq, c) => (freq[c] = (freq[c] || 0) + 1, freq), {});
            return Object.values(frequencies).reduce((sum, f) => sum - f / len * Math.log2(f / len), 0).toFixed(2);
        };

        const getStats = (text) => {
            if (!text) return { chars: 0, words: 0, lines: 0, bytes: 0, entropy: '0.00' };
            const byteLen = new TextEncoder().encode(text).length;
            return {
                chars: Array.from(text).length,
                words: text.trim().split(/\s+/).filter(w => w.length > 0).length,
                lines: text.split(/\r\n|\r|\n/).length,
                bytes: byteLen,
                entropy: getEntropy(text)
            };
        };

        const fallbackCopy = (text, setToast) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = 'fixed';

            document.body.appendChild(textArea);

            catch (err) { setToast('Failed to copy!'); }

        const copyToClipboard = (text, setToast) => {

                } else {

            } catch (err) { fallbackCopy(text, setToast); }

        function safeUrlDecode(str) { 
            try { if (/%[0-9A-Fa-f]{2}/.test(str)) return decodeURIComponent(str); return str; } 
            catch(e) { try { return unescape(str); } catch(err) { return str; } } 
        }

        function safeFormUrlDecode(str) {
            try {
                if (/%[0-9A-Fa-f]{2}/.test(str) || str.includes('+')) {
                    return decodeURIComponent(str.replace(/\+/g, ' '));
                }
                return str;
            } catch(e) { return safeUrlDecode(str); }
        }

        function analyzeData(inputStr, isFormParam = false) {
            if (!inputStr || typeof inputStr !== 'string') {
                return { original: inputStr, final: inputStr, steps: [], isEncoded: false, b64Count: 0, urlCount: 0, isJson: false };
            }
            let current = inputStr.trim();
            let steps = [];
            let b64Count = 0;
            let urlCount = 0;
            let loopLimit = 6; 
            
            while (loopLimit > 0) {
                let changed = false;
                loopLimit--;

                // 1. Check JWT token format
                if (/^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*$/.test(current)) {
                    try {
                        const parts = current.split('.');
                        const decPart = (s) => {
                            let b = s.replace(/-/g, '+').replace(/_/g, '/');
                            while (b.length % 4) b += '=';
                            const binStr = atob(b);
                            const bytes = new Uint8Array(binStr.length);
                            for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
                        };
                        const jwtObj = {
                            Header: JSON.parse(decPart(parts[0])),
                            Payload: JSON.parse(decPart(parts[1])),
                            Signature: parts[2] || 'None'
                        };
                        current = JSON.stringify(jwtObj, null, 2);
                        b64Count++;
                        steps.push({ method: 'JWT Token Decode', value: current });
                        changed = true;
                        break;
                    } catch (e) {}
                }

                // 2. Check URL Encoding
                if (/%[0-9A-Fa-f]{2}/.test(current) || (isFormParam && current.includes('+') && current.includes('='))) {
                    let urlDec = isFormParam ? safeFormUrlDecode(current) : safeUrlDecode(current);
                    if (urlDec !== current && urlDec !== "") { 
                        current = urlDec;
                        urlCount++;
                        steps.push({ method: 'URL Decode', value: current });
                        changed = true;
                        continue; 
                    }
                }

                // 3. Check HTML Entities
                if (/&(?:lt|gt|quot|amp|#0*39|#x0*27);/i.test(current)) {
                    const htmlDec = rawHtmlDecode(current);
                    if (htmlDec !== current && htmlDec !== "") {
                        current = htmlDec;
                        steps.push({ method: 'HTML Entity Decode', value: current });
                        changed = true;
                        continue;
                    }
                }

                // 4. Check Spaced or Continuous Hexadecimal
                if (/^([0-9a-fA-F]{2}\s+){3,}[0-9a-fA-F]{2}$/.test(current) || (/^[0-9a-fA-F]{16,}$/.test(current) && current.length % 2 === 0)) {
                    try {
                        const cleanHex = current.replace(/\s+/g, '');
                        const bytes = new Uint8Array(cleanHex.length / 2);
                        for (let i = 0; i < cleanHex.length; i += 2) {
                            bytes[i / 2] = parseInt(cleanHex.substr(i, 2), 16);
                        }
                        const decodedHex = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                        if (decodedHex && /^[\x20-\x7E\r\n\t\u00A0-\uFFFF]+$/.test(decodedHex)) {
                            current = decodedHex;
                            steps.push({ method: 'Hexadecimal Decode', value: current });
                            changed = true;
                            continue;
                        }
                    } catch (e) {}
                }

                // 5. Check Base64 / Base64URL
                if (/^[A-Za-z0-9+/\-_]+={0,2}$/.test(current) && current.length >= 8 && !/^\d+$/.test(current)) {
                    try {
                        let b64 = current.replace(/-/g, '+').replace(/_/g, '/');
                        while (b64.length % 4) b64 += '='; 
                        const binStr = atob(b64);
                        const bytes = new Uint8Array(binStr.length);
                        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        let decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                        
                        if (decoded && decoded !== current && /^[\x09\x0A\x0D\x20-\x7E\u00A0-\uFFFF]+$/.test(decoded)) {
                            current = decoded;
                            b64Count++;
                            steps.push({ method: `Base64 Decode (Lvl ${b64Count})`, value: current });
                            changed = true;
                            continue; 
                        }
                    } catch (e) {}
                }

                if (!changed) break; 
            }
            
            let isJson = false;
            try { 
                let j = JSON.parse(current); 
                if (typeof j === 'object' && j !== null) {
                    current = JSON.stringify(j, null, 2);
                    isJson = true;
                } 
            } catch (e) {}
            
            return { original: inputStr, final: current, steps, b64Count, urlCount, isJson, isEncoded: steps.length > 0 };
        }

        function tokenizeCurl(str) {
            const cleaned = str.replace(/\\\r?\n/g, ' ').replace(/\^\r?\n/g, ' ');
            const tokens = [];
            let current = '';
            let inSingle = false, inDouble = false, escapeNext = false;

            for (let i = 0; i < cleaned.length; i++) {
                const c = cleaned[i];
                if (escapeNext) {
                    current += c;
                    escapeNext = false;
                    continue;
                }
                if (c === '\\' && !inSingle) {
                    escapeNext = true;
                    continue;
                }
                if (c === '$' && !inSingle && !inDouble && cleaned[i + 1] === "'") {
                    continue;
                }
                if (c === "'" && !inDouble) {
                    inSingle = !inSingle;
                    continue;
                }
                if (c === '"' && !inSingle) {
                    inDouble = !inDouble;
                    continue;
                }
                if (/\s/.test(c) && !inSingle && !inDouble) {
                    if (current) {
                        tokens.push(current);
                        current = '';
                    }
                    continue;
                }
                current += c;
            }
            if (current) tokens.push(current);
            return tokens;
        }

                        </div>
                        <div className="app-panel flex flex-col h-56 sm:h-64 overflow-hidden">
                            <div className={`px-3 py-1.5 border-b flex items-center justify-between text-xs font-semibold ${isDark ? 'border-slate-800 bg-slate-800/40 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'}`}>
                                <span className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span> Modified</span>
                                <button onClick={() => copyToClipboard(rightText, setToast)} className="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 opacity-60 hover:opacity-100 transition-colors" title="Copy Modified"><Icons.Copy size={15}/></button>
                            </div>
                            <textarea
                                value={rightText}
                                onChange={e => setRightText(e.target.value)}
                                placeholder="Paste modified payload..."
                                className={`w-full flex-1 p-3 font-mono text-[13px] resize-none bg-transparent custom-scrollbar ${isDark ? 'text-slate-200' : 'text-slate-800'}`}
                                spellCheck="false"
                            />
                        </div>
                    </div>

                    <div className="app-panel flex flex-col flex-1 min-h-[240px] overflow-hidden">
                        <div className={`px-3 py-1.5 border-b flex items-center justify-between text-xs font-semibold ${isDark ? 'border-slate-800 bg-slate-800/40 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'}`}>
                            <span className="flex items-center gap-2"><Icons.GitCompare size={14} className="text-slate-400" /> Diff Inspector</span>
                            <div className="flex items-center gap-3 text-[10px] font-mono">
                                <span className="text-red-400">■ Removed</span>
                                <span className="text-blue-400">■ Added</span>
                            </div>
                        </div>
                        <div className="overflow-auto flex-1 font-mono text-[13px] divide-y divide-slate-800/30 custom-scrollbar">
                            {diffLines.rows.map((r) => (
                                <div key={r.line} className={`grid grid-cols-1 md:grid-cols-2 ${
                                    r.status === 'same' ? '' :
                                    r.status === 'modified' ? (isDark ? 'bg-amber-500/5' : 'bg-amber-50/70') :
                                    r.status === 'added' ? (isDark ? 'bg-blue-500/10' : 'bg-blue-50') :
                                    (isDark ? 'bg-red-500/10' : 'bg-red-50')
                                }`}>
                                    <div className={`flex items-start gap-2.5 px-3 py-1.5 border-r ${isDark ? 'border-slate-800/60' : 'border-slate-200'} ${
                                        r.status === 'removed' || r.status === 'modified' ? (isDark ? 'text-red-300' : 'text-red-800') : 'opacity-75'
                                    }`}>
                                        <span className="w-6 text-right opacity-30 select-none shrink-0">{r.line}</span>
                                        <span className="break-all whitespace-pre-wrap">{r.left}</span>
                                    </div>
                                    <div className={`flex items-start gap-2.5 px-3 py-1.5 ${
                                        r.status === 'added' || r.status === 'modified' ? (isDark ? 'text-blue-300' : 'text-blue-800') : 'opacity-75'
                                    }`}>
                                        <span className="w-6 text-right opacity-30 select-none shrink-0">{r.line}</span>
                                        <span className="break-all whitespace-pre-wrap">{r.right}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        });

        const CurlDecoderTab = memo(({ isDark, setToast, curlInput, setCurlInput, parsedResults, setParsedResults, onSendToEditor }) => {
            const [redactSecrets, setRedactSecrets] = useState(false);
            const [codeLang, setCodeLang] = useState('fetch');

            const maskValue = (key, val) => {
                if (!redactSecrets || !val) return val;
                if (/auth|token|key|secret|session|cookie|pass|bearer|jwt/i.test(key)) {
                    if (val.length <= 8) return '••••••••';
                    return val.substring(0, 4) + '••••••••••••' + val.substring(val.length - 4);
                }
                return val;
            };

            const processRequest = (customInput) => {
                const rawCmd = typeof customInput === 'string' ? customInput : curlInput;
                if (!rawCmd.trim()) return;
                let results = { method: 'GET', url: 'No URL found', fullUrl: '', queryParams: [], cookies: [], headers: [], bodyDump: null, bodyParams: [], rawBody: '' };
                try {
                    const tokens = tokenizeCurl(rawCmd);
                    if (tokens.length === 0 || !tokens[0].toLowerCase().includes('curl')) {
                        return setToast("Error: Doesn't appear to be a valid cURL command.");
                    }

                    let skipNext = false;
                    for (let i = 1; i < tokens.length; i++) {
                        if (skipNext) { skipNext = false; continue; }
                        const t = tokens[i];
                        
                        if (t === '-X' || t === '--request') {
                            results.method = tokens[i + 1]?.toUpperCase() || 'GET';
                            skipNext = true;
                        } else if (t.startsWith('-X') && t.length > 2) {
                            results.method = t.slice(2).toUpperCase();
                        } else if (t === '-H' || t === '--header') {
                            const header = tokens[i + 1];
                            skipNext = true;
                            if (header) {
                                const splitIdx = header.indexOf(':');
                                if (splitIdx > -1) {
                                    const hName = header.substring(0, splitIdx).trim();
                                    const hVal = header.substring(splitIdx + 1).trim();
                                    if (hName.toLowerCase() === 'cookie') {
                                        hVal.split(';').forEach(pair => { 
                                            let eqIdx = pair.indexOf('='); 
                                            if (eqIdx > -1) {
                                                results.cookies.push({
                                                    key: pair.substring(0, eqIdx).trim(),
                                                    analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true)
                                                });
                                            }
                                        });
                                    } else {
                                        let an = analyzeData(hVal);
                                        if (hName.toLowerCase() === 'authorization' && hVal.toLowerCase().startsWith('bearer ')) {
                                            an = analyzeData(hVal.slice(7).trim());
                                            if (an.isEncoded) an.original = hVal; 
                                        }
                                        results.headers.push({ key: hName, rawVal: hVal, analysis: an });
                                    }
                                }
                            }
                        } else if (t === '-b' || t === '--cookie') {
                            const cookieString = tokens[i + 1];
                            skipNext = true;
                            if (cookieString) {
                                cookieString.split(';').forEach(pair => { 
                                    let eqIdx = pair.indexOf('='); 
                                    if (eqIdx > -1) {
                                        results.cookies.push({
                                            key: pair.substring(0, eqIdx).trim(),
                                            analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true)
                                        });
                                    }
                                });
                            }
                        } else if (t === '-d' || t === '--data' || t === '--data-raw' || t === '--data-binary' || t === '--data-urlencode') {
                            const bodyRaw = tokens[i + 1];
                            skipNext = true;
                            if (results.method === 'GET') results.method = 'POST'; 
                            if (bodyRaw) {
                                let mergedData = bodyRaw.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
                                results.rawBody = mergedData;
                                if ((t === '--data-urlencode' || mergedData.includes('&')) && mergedData.includes('=') && !mergedData.trim().startsWith('{')) {
                                    try {
                                        const params = new URLSearchParams(mergedData);
                                        for (const [key, value] of params.entries()) {
                                            results.bodyParams.push({ key, analysis: analyzeData(value, true) });
                                        }
                                    } catch (e) { results.bodyDump = analyzeData(mergedData); }
                                } else {
                                    results.bodyDump = analyzeData(mergedData);
                                    try {
                                        const parsedJson = JSON.parse(results.bodyDump.final);
                                        if (parsedJson && typeof parsedJson === 'object' && !Array.isArray(parsedJson)) {
                                            Object.entries(parsedJson).forEach(([k, v]) => {
                                                if (typeof v === 'string') {
                                                    const fieldAn = analyzeData(v, false);
                                                    if (fieldAn.isEncoded) {
                                                        results.bodyParams.push({ key: `JSON.${k}`, analysis: fieldAn });
                                                    }
                                                }
                                            });
                                        }
                                    } catch (e) {}
                                }
                            }
                        } else if (t === '--url') {
                            results.url = tokens[i + 1];
                            results.fullUrl = tokens[i + 1];
                            skipNext = true;
                        } else if (/^https?:\/\//i.test(t)) {
                            results.url = t;
                            results.fullUrl = t;
                        }
                    }

                    if (results.url && results.url !== 'No URL found') {
                        try {
                            const u = new URL(results.url);
                            results.url = u.origin + u.pathname;
                            for (const [key, value] of u.searchParams.entries()) {
                                results.queryParams.push({ key, analysis: analyzeData(value, true) });
                            }
                        } catch (e) {} 
                    }
                    setParsedResults(results);
                    setToast("Parsed successfully.");
                } catch (e) { setToast("Error parsing cURL: " + e.message); }
            };

            const generateCodeSnippet = () => {
                if (!parsedResults) return '';
                const targetUrl = parsedResults.fullUrl || parsedResults.url;
                const hdrs = {};
                parsedResults.headers.forEach(h => { hdrs[h.key] = redactSecrets ? maskValue(h.key, h.analysis.original) : h.analysis.original; });
                if (parsedResults.cookies.length > 0) {
                    hdrs['Cookie'] = parsedResults.cookies.map(c => `${c.key}=${redactSecrets ? 'REDACTED' : c.analysis.original}`).join('; ');
                }

                if (codeLang === 'fetch') {
                    return `fetch(${JSON.stringify(targetUrl)}, {\n  method: ${JSON.stringify(parsedResults.method)},\n  headers: ${JSON.stringify(hdrs, null, 4).replace(/\n/g, '\n  ')}${parsedResults.rawBody ? `,\n  body: ${JSON.stringify(parsedResults.rawBody)}` : ''}\n})\n  .then(res => res.json())\n  .then(data => console.log(data));`;
                } else if (codeLang === 'axios') {
                    return `import axios from 'axios';\n\nconst response = await axios({\n  method: ${JSON.stringify(parsedResults.method.toLowerCase())},\n  url: ${JSON.stringify(targetUrl)},\n  headers: ${JSON.stringify(hdrs, null, 4).replace(/\n/g, '\n  ')}${parsedResults.rawBody ? `,\n  data: ${JSON.stringify(parsedResults.rawBody)}` : ''}\n});\nconsole.log(response.data);`;
                } else if (codeLang === 'go') {
                    const headerLines = Object.entries(hdrs).map(([k, v]) => `\treq.Header.Set(${JSON.stringify(k)}, ${JSON.stringify(v)})`).join('\n');
                    return `package main\n\nimport (\n\t"fmt"\n\t"io"\n\t"net/http"\n\t"strings"\n)\n\nfunc main() {\n\tpayload := strings.NewReader(${JSON.stringify(parsedResults.rawBody || '')})\n\treq, _ := http.NewRequest(${JSON.stringify(parsedResults.method)}, ${JSON.stringify(targetUrl)}, payload)\n${headerLines}\n\tres, _ := http.DefaultClient.Do(req)\n\tdefer res.Body.Close()\n\tbody, _ := io.ReadAll(res.Body)\n\tfmt.Println(string(body))\n}`;
                } else {
                    return `import requests\n\nurl = ${JSON.stringify(targetUrl)}\nheaders = ${JSON.stringify(hdrs, null, 4)}\n${parsedResults.rawBody ? `data = ${JSON.stringify(parsedResults.rawBody)}\n\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers, data=data)` : `\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers)`}\nprint(response.text)`;
                }
            };

            const AnalysisRow = ({ itemKey, analysis }) => {
                const displayFinal = maskValue(itemKey, analysis.final);
                const displayOriginal = maskValue(itemKey, analysis.original);

                if (!analysis.isEncoded) {
                    return (
                        <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                            <div className={`md:w-1/4 p-2.5 border-b md:border-b-0 md:border-r flex items-center justify-between gap-2 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                                <span className={`font-semibold text-xs break-words ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>{itemKey}</span>
                                <button
                                    onClick={() => onSendToEditor(analysis.final, itemKey)}
                                    className="p-1 rounded hover:bg-slate-700/40 text-slate-500 hover:text-blue-400 transition-colors shrink-0"
                                    title="Open in Editor Tab"
                                >
                                    <Icons.CornerUpLeft size={12} />
                                </button>
                            </div>
                            <div className="md:w-3/4 p-2.5 font-mono text-[13px] relative">
                                {analysis.isJson && !redactSecrets
                                    ? <div className={`p-2.5 rounded-lg overflow-x-auto relative border ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                                        <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(analysis.final) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                      </div>
                                    : <div className={`break-words ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>{displayFinal}</div>
                                }
                            </div>
                        </div>
                    );
                }
                
                let badge = <span className="px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-500/10 text-blue-500 border border-blue-500/20">ENCODED</span>;
                if (analysis.b64Count >= 3) badge = <span className="px-1.5 py-0.5 rounded text-[10px] font-medium bg-red-500/10 text-red-500 border border-red-500/20">TRIPLE B64</span>;
                else if (analysis.b64Count === 2) badge = <span className="px-1.5 py-0.5 rounded text-[10px] font-medium bg-orange-500/10 text-orange-500 border border-orange-500/20">DOUBLE B64</span>;
                else if (analysis.urlCount > 0) badge = <span className="px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-500/10 text-blue-500 border border-blue-500/20">URL ENCODED</span>;

                return (
                    <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                        <div className={`md:w-1/4 p-2.5 border-b md:border-b-0 md:border-r flex items-center justify-between gap-2 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                            <span className={`font-semibold text-xs break-words ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>{itemKey}</span>
                            <button
                                onClick={() => onSendToEditor(analysis.final, itemKey)}
                                className="p-1 rounded hover:bg-slate-700/40 text-slate-500 hover:text-blue-400 transition-colors shrink-0"
                                title="Open Decoded Value in Editor Tab"
                            >
                                <Icons.CornerUpLeft size={12} />
                            </button>
                        </div>
                        <div className="md:w-3/4 p-2.5">
                            <div className="flex items-center gap-2 mb-2">{badge}</div>
                            <div className={`p-2 rounded-lg text-xs font-mono break-words mb-3 max-h-32 overflow-y-auto ${isDark ? 'bg-slate-900 text-slate-400' : 'bg-slate-100 text-slate-500'}`}>{displayOriginal}</div>
                            
                            <div className="space-y-2">
                                {analysis.steps.map((step, i) => {
                                    const isJSONView = (i === analysis.steps.length - 1) && analysis.isJson && !redactSecrets;
                                    return (
                                        <div key={i} className={`relative pl-3 border-l-2 ${isDark ? 'border-slate-700' : 'border-slate-200'}`}>
                                            <span className={`text-[10px] uppercase font-semibold flex items-center gap-1.5 mb-1 ${isDark ? 'text-blue-400' : 'text-blue-600'}`}>
                                                {step.method}
                                            </span>
                                            {isJSONView ? (
                                                <div className={`p-2 rounded-lg overflow-x-auto max-h-[300px] font-mono text-xs border ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                                                    <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(step.value) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                                </div>
                                            ) : (
                                                <div className={`p-2 rounded-lg font-mono text-xs break-words ${isDark ? 'bg-slate-900 text-slate-300' : 'bg-slate-50 text-slate-700'}`}>
                                                    {maskValue(itemKey, step.value)}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col gap-4 animate-fade-in w-full h-full pb-6 overflow-y-auto custom-scrollbar">
                    <div className="app-panel flex flex-col flex-shrink-0">
                        <div className={`px-4 py-2 border-b flex flex-wrap items-center justify-between gap-2 ${isDark ? 'border-slate-800 bg-slate-800/30' : 'border-slate-100 bg-slate-50/50'}`}>
                            <div className="flex items-center gap-2">
                                <Icons.Terminal size={14} className="text-blue-500" />
                                <span className="text-xs font-semibold">Paste cURL Command</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => { setCurlInput(SAMPLE_CURL); processRequest(SAMPLE_CURL); }}
                                    className={`px-2 py-1 rounded text-[11px] font-medium flex items-center gap-1.5 border transition-all ${
                                        isDark ? 'bg-slate-800 border-slate-700 text-slate-300 hover:text-white' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    <Icons.Zap size={12} /> Sample
                                </button>
                                <button
                                    onClick={() => setRedactSecrets(!redactSecrets)}
                                    className={`px-2 py-1 rounded text-[11px] font-medium flex items-center gap-1.5 border transition-all ${
                                        redactSecrets
                                        ? 'bg-red-500/10 border-red-500/30 text-red-500'
                                        : (isDark ? 'bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200' : 'bg-white border-slate-200 text-slate-600')
                                    }`}
                                    title="Mask tokens & cookies for safe screen-sharing"
                                >
                                    {redactSecrets ? <Icons.EyeOff size={12} /> : <Icons.Eye size={12} />}
                                    {redactSecrets ? 'Hidden' : 'Redact'}
                                </button>
                            </div>
                        </div>
                        <textarea 
                            value={curlInput} onChange={(e) => setCurlInput(e.target.value)}
                            className={`w-full p-4 outline-none resize-y min-h-[110px] font-mono text-[13px] leading-relaxed custom-scrollbar ${isDark ? 'bg-transparent text-slate-300 placeholder-slate-600' : 'bg-transparent text-slate-800 placeholder-slate-400'}`} 
                            placeholder="curl 'https://api.target.com/data' -H 'Authorization: Bearer eyJhb...' -b 'session=base64_cookie'" spellCheck="false"
                        />
                        <div className={`px-4 py-2 border-t flex flex-wrap justify-between items-center gap-2 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                            <span className="text-[11px] opacity-60">Auto-unpacks nested encodings.</span>
                            <button onClick={() => processRequest()} className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1.5 px-4 rounded-md transition-all active:scale-95 flex items-center gap-2 ml-auto">
                                <Icons.Cpu size={14} /> Parse
                            </button>
                        </div>
                    </div>

                    {parsedResults && (
                        <div className="flex flex-col gap-4 animate-slide-up">
                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center gap-2 font-semibold text-xs ${isDark ? 'border-slate-800 bg-slate-800/30 text-slate-300' : 'border-slate-100 bg-slate-50/50 text-slate-600'}`}><Icons.Link size={14} className="text-slate-400"/> Endpoint</div>
                                <div className="p-3 font-mono text-[13px] break-all flex flex-wrap items-center gap-3">
                                    <span className={`px-2 py-0.5 rounded font-bold shrink-0 ${isDark ? 'bg-slate-800 text-blue-400' : 'bg-blue-50 text-blue-700'}`}>{parsedResults.method}</span>
                                    <span>{parsedResults.url}</span>
                                </div>
                            </div>
                            
                            {parsedResults.queryParams.length > 0 && (
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-semibold text-xs ${isDark ? 'border-slate-800 bg-slate-800/30 text-slate-300' : 'border-slate-100 bg-slate-50/50 text-slate-600'}`}><Icons.Code size={14} className="text-slate-400"/> Query Parameters</div>
                                    <div>{parsedResults.queryParams.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />)}</div>
                                </div>
                            )}
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-semibold text-xs ${isDark ? 'border-slate-800 bg-slate-800/30 text-slate-300' : 'border-slate-100 bg-slate-50/50 text-slate-600'}`}><Icons.AlignLeft size={14} className="text-slate-400"/> Headers</div>
                                    <div>{parsedResults.headers.length > 0 ? parsedResults.headers.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />) : <div className="p-3 text-center text-xs opacity-50">None</div>}</div>
                                </div>
                                <div className="app-panel">
                                    <div className={`px-4 py-2 border-b flex items-center gap-2 font-semibold text-xs ${isDark ? 'border-slate-800 bg-slate-800/30 text-slate-300' : 'border-slate-100 bg-slate-50/50 text-slate-600'}`}><Icons.Lock size={14} className="text-slate-400"/> Cookies</div>
                                    <div>{parsedResults.cookies.length > 0 ? parsedResults.cookies.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />) : <div className="p-3 text-center text-xs opacity-50">None</div>}</div>
                                </div>
                            </div>

                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center gap-2 font-semibold text-xs ${isDark ? 'border-slate-800 bg-slate-800/30 text-slate-300' : 'border-slate-100 bg-slate-50/50 text-slate-600'}`}><Icons.Database size={14} className="text-slate-400"/> Body Payload</div>
                                <div>
                                    {parsedResults.bodyDump && <AnalysisRow itemKey="Raw Body" analysis={parsedResults.bodyDump} />}
                                    {parsedResults.bodyParams.length > 0 && parsedResults.bodyParams.map((p, i) => <AnalysisRow key={i} itemKey={p.key} analysis={p.analysis} />)}
                                    {!parsedResults.bodyDump && parsedResults.bodyParams.length === 0 && (
                                        <div className="p-3 text-center text-xs opacity-50">No body payload</div>
                                    )}
                                </div>
                            </div>

                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex flex-wrap items-center justify-between gap-2 ${isDark ? 'border-slate-800 bg-slate-800/30' : 'border-slate-100 bg-slate-50/50'}`}>
                                    <div className="flex items-center gap-2 font-semibold text-xs">
                                        <Icons.FileCode size={14} className="text-slate-400"/> Code Generator
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className={`flex flex-wrap p-0.5 rounded-md border ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                                            {[
                                                { id: 'fetch', label: 'Fetch' },
                                                { id: 'axios', label: 'Axios' },
                                                { id: 'python', label: 'Python' },
                                                { id: 'go', label: 'Go' }
                                            ].map(lang => (
                                                <button
                                                    key={lang.id}
                                                    onClick={() => setCodeLang(lang.id)}
                                                    className={`px-2.5 py-1 rounded text-[11px] font-medium transition-all ${codeLang === lang.id ? (isDark ? 'bg-slate-700 text-white' : 'bg-white text-slate-800 shadow-sm') : 'text-slate-500'}`}
                                                >
                                                    {lang.label}
                                                </button>
                                            ))}
                                        </div>
                                        <button onClick={() => copyToClipboard(generateCodeSnippet(), setToast)} className="p-2 rounded-md border border-slate-700/50 hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Copy Code"><Icons.Copy size={16}/></button>
                                    </div>
                                </div>
                                <pre className={`p-4 font-mono text-[13px] overflow-x-auto m-0 ${isDark ? 'text-slate-300' : 'text-slate-800'}`}>
                                    {generateCodeSnippet()}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        });

        const StandardDecoderTab = memo(({ isDark, setToast, AlgorithmsLib, ws, updateWorkspace }) => {
            const { input, output, mode, category, algo, caesarShift, vigenereKey, strUtilMode, expectedHash = '', secretKey = '' } = ws;
            const [errorMsg, setErrorMsg] = useState(null);
            const [showQR, setShowQR] = useState(false);
            const [wordWrap, setWordWrap] = useState(true);
            const [expandedPane, setExpandedPane] = useState(null); 
            const [mobileView, setMobileView] = useState('both');
            const qrCanvasRef = useRef(null);

            const setInput = (val) => updateWorkspace(ws.id, { input: val });
            const setOutput = (val) => updateWorkspace(ws.id, { output: val });

            const detectedHint = useMemo(() => {
                if (!input || algo === 'magic') return null;
                const d = detectPayloadType(input);
                if (d && d.algo !== algo) return d;
                return null;
            }, [input, algo]);

            useEffect(() => {
                if (showQR && qrCanvasRef.current && output) {
                    if (window.QRCode && typeof window.QRCode.toCanvas === 'function') {
                        window.QRCode.toCanvas(
                            qrCanvasRef.current,
                            output,
                            { width: 160, margin: 1, color: { dark: '#000000', light: '#ffffff' } },
                            (err) => {
                                if (err) {
                                    setToast("Payload too large for QR code.");
                                    setShowQR(false);
                                }
                            }
                        );
                    } else {
                        setToast("QR Code library unavailable.");
                        setShowQR(false);
                    }
                }
            }, [showQR, output, setToast]);

            useEffect(() => {
                let isMounted = true;
                const process = async () => {
                    setErrorMsg(null);
                    setShowQR(false); 
                    if (algo === 'uuid') { if (isMounted) setOutput(AlgorithmsLib.uuid()); return; }
                    if (algo === 'passgen') { if (isMounted) setOutput(AlgorithmsLib.passgen()); return; }
                    if (!input) { if (isMounted) setOutput(''); return; }
                    
                    try {
                        let res = '', effectiveMode = mode;
                        if (category === 'hashes') effectiveMode = 'encode';
                        if (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'extract_secrets', 'epoch', 'regex_tester', 'csv2json', 'cidr'].includes(algo)) effectiveMode = 'decode';

                        if (algo === 'hmac_sha256') {
                            res = await AlgorithmsLib.hmacSha256(input, secretKey || 'DEFAULT_SECRET');
                        } else if (category === 'hashes') {
                            res = await AlgorithmsLib.hash(input, algo);
                        } else if (algo === 'aes_gcm') {
                            res = effectiveMode === 'encode'
                                ? await AlgorithmsLib.aesEncrypt(input, secretKey || 'decoderx_passphrase')
                                : await AlgorithmsLib.aesDecrypt(input, secretKey || 'decoderx_passphrase');
                        } else if (algo === 'jwt') {
                            res = await AlgorithmsLib.parseJWT(input, secretKey);
                        } else {
                            switch (algo) {
                                case 'magic': {
                                    const analysis = analyzeData(input, true);
                                    if (analysis.steps.length > 0) {
                                        res = JSON.stringify({
                                            Detected_Layers: analysis.steps.map(s => s.method),
                                            Final_Decoded_Payload: analysis.isJson ? JSON.parse(analysis.final) : analysis.final
                                        }, null, 4);
                                    } else {
                                        res = analysis.final;
                                    }
                                    break;
                                }
                                case 'defang': res = effectiveMode === 'encode' ? AlgorithmsLib.defang(input) : AlgorithmsLib.refang(input); break;
                                case 'cidr': res = AlgorithmsLib.cidrCalc(input); break;
                                case 'base64': res = effectiveMode === 'encode' ? AlgorithmsLib.b64Encode(input) : AlgorithmsLib.b64Decode(input); break;
                                case 'base64url': res = effectiveMode === 'encode' ? AlgorithmsLib.b64UrlEncode(input) : AlgorithmsLib.b64UrlDecode(input); break;
                                case 'gzip': res = effectiveMode === 'encode' ? await AlgorithmsLib.gzipCompress(input) : await AlgorithmsLib.gzipDecompress(input); break;
                                case 'deflate': res = effectiveMode === 'encode' ? await AlgorithmsLib.deflateCompress(input) : await AlgorithmsLib.deflateDecompress(input); break;
                                case 'base32': res = effectiveMode === 'encode' ? AlgorithmsLib.b32Encode(input) : AlgorithmsLib.b32Decode(input); break;
                                case 'url': res = effectiveMode === 'encode' ? encodeURIComponent(input) : safeUrlDecode(input); break;
                                case 'url_all': res = effectiveMode === 'encode' ? AlgorithmsLib.urlEncodeAll(input) : safeUrlDecode(input); break;
                                case 'unicode': res = effectiveMode === 'encode' ? AlgorithmsLib.toUnicode(input) : AlgorithmsLib.fromUnicode(input); break;
                                case 'urlparse': res = AlgorithmsLib.urlParse(input); break;
                                case 'hex': res = effectiveMode === 'encode' ? AlgorithmsLib.toHex(input) : AlgorithmsLib.fromHex(input); break;
                                case 'binary': res = effectiveMode === 'encode' ? AlgorithmsLib.toBin(input) : AlgorithmsLib.fromBin(input); break;
                                case 'octal': res = effectiveMode === 'encode' ? AlgorithmsLib.toOctal(input) : AlgorithmsLib.fromOctal(input); break;
                                case 'html': res = effectiveMode === 'encode' ? escapeHTML(input) : AlgorithmsLib.htmlDecode(input); break;
                                case 'reverse': res = AlgorithmsLib.rev(input); break;
                                case 'atbash': res = AlgorithmsLib.atbash(input); break;
                                case 'rot47': res = AlgorithmsLib.rot47(input); break;
                                case 'caesar': res = AlgorithmsLib.caesarCipher(input, parseInt(caesarShift) || 13, effectiveMode === 'decode'); break;
                                case 'vigenere': res = AlgorithmsLib.vigenereCipher(input, vigenereKey, effectiveMode === 'decode'); break;
                                case 'morse': res = effectiveMode === 'encode' ? AlgorithmsLib.toMorse(input) : AlgorithmsLib.fromMorse(input); break;
                                case 'json': res = AlgorithmsLib.formatJSON(input, effectiveMode === 'encode'); break;
                                case 'csv2json': res = AlgorithmsLib.csv2json(input); break;
                                case 'hexdump': res = AlgorithmsLib.hexdump(input); break;
                                case 'extract_ips': res = AlgorithmsLib.extractIPs(input); break;
                                case 'extract_urls': res = AlgorithmsLib.extractURLs(input); break;
                                case 'extract_secrets': res = AlgorithmsLib.extractSecrets(input); break;
                                case 'epoch': res = AlgorithmsLib.epochConvert(input); break;
                                case 'string_utils': res = AlgorithmsLib.stringUtils(input, strUtilMode); break;
                                case 'waf_tamper': res = AlgorithmsLib.wafTamper(input); break;
                                case 'regex_tester': res = AlgorithmsLib.regexTester(input); break;
                                default: res = input;
                            }
                        }
                        if (isMounted) setOutput(res);
                    } catch (e) {
                        if (isMounted) {
                            setOutput('');
                            setErrorMsg(e.message || 'Error processing payload.');
                        }
                    }
                };
                const timeoutId = setTimeout(process, 65);
                return () => { isMounted = false; clearTimeout(timeoutId); };
            }, [input, mode, algo, category, caesarShift, vigenereKey, strUtilMode, secretKey]);

            const applyJsonFormat = (type) => {
                let formattedAny = false;
                if (output) {
                    try {
                        const parsedOut = JSON.parse(output);
                        if (typeof parsedOut === 'object' && parsedOut !== null) {
                            setOutput(type === 'beautify' ? JSON.stringify(parsedOut, null, 4) : JSON.stringify(parsedOut));
                            formattedAny = true;
                        }
                    } catch (e) {}
                }
                if (input) {
                    try {
                        const parsedIn = JSON.parse(input);
                        if (typeof parsedIn === 'object' && parsedIn !== null) {
                            setInput(type === 'beautify' ? JSON.stringify(parsedIn, null, 4) : JSON.stringify(parsedIn));
                            formattedAny = true;
                        }
                    } catch (e) {}
                }
                if (formattedAny) {
                    setToast(`JSON ${type === 'beautify' ? 'Formatted' : 'Minified'}`);
                } else {
                    setToast('No valid JSON found.');
                }
            };

            const downloadFile = () => {
                if (output && !errorMsg) {
                    const url = URL.createObjectURL(new Blob([output], { type: "text/plain" }));
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `decoderx_${algo}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const swap = () => {
                if (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'extract_secrets', 'uuid', 'passgen', 'epoch', 'regex_tester', 'csv2json', 'cidr'].includes(algo) || category === 'hashes') return;
                updateWorkspace(ws.id, {
                    input: output,
                    mode: mode === 'encode' ? 'decode' : 'encode'
                });
                setShowQR(false);
            };

            const chainOutputToInput = () => {
                if (!output || errorMsg) return;
                updateWorkspace(ws.id, { input: output });
                setToast('Output chained to Input');
            };

            const handleDroppedFile = (file) => {
                if (file.size > 1024 * 1024 * 5) return setToast("File too large (Max 5MB)");
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setInput(ev.target.result);
                    setToast(`Loaded: ${file.name}`);
                };
                reader.readAsText(file);
            };

            const inStats = useMemo(() => getStats(input), [input]);
            const outStats = useMemo(() => getStats(output), [output]);
            const isLockMode = ['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'extract_secrets', 'uuid', 'passgen', 'epoch', 'string_utils', 'waf_tamper', 'regex_tester', 'csv2json', 'cidr'].includes(algo) || category === 'hashes';
            
            let isJsonOutput = false, formattedJsonOutput = '';
            if (!errorMsg && output && (output.trim().startsWith('{') || output.trim().startsWith('['))) {
                try { JSON.parse(output); isJsonOutput = true; formattedJsonOutput = output; } catch (e) {}
            }

            const getEntropyBadge = (e) => {
                const val = parseFloat(e);
                if (val === 0) return null;
                if (val < 3.5) return <span className="text-slate-500">Low</span>;
                if (val < 5.2) return <span className="text-slate-400">Med</span>;
                return <span className="text-amber-500">High</span>;
            };

            const PaneHeader = ({ title, isOutput, copyVal, paneKey }) => (
                <div className={`px-3 py-1.5 border-b flex items-center justify-between gap-2 shrink-0 ${isDark ? 'border-slate-800 bg-slate-800/40' : 'border-slate-200 bg-slate-50'}`}>
                    <div className="flex items-center gap-2 min-w-0">
                        <span className={`text-[11px] font-semibold tracking-wider shrink-0 ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>{title}</span>
                        {isOutput && errorMsg && <span className="ml-1 px-1 py-0.5 rounded-sm text-[9px] bg-red-500/10 text-red-500 border border-red-500/20">ERROR</span>}
                        {!isOutput && detectedHint && (
                            <button
                                onClick={() => {
                                    updateWorkspace(ws.id, { category: detectedHint.category, algo: detectedHint.algo, mode: detectedHint.mode });
                                    setToast(`Switched to ${detectedHint.label}`);
                                }}
                                className="ml-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-500/10 text-blue-500 hover:bg-blue-500 hover:text-white transition-all flex items-center gap-1 truncate"
                                title="Switch to detected format"
                            >
                                <Icons.Wand size={10} /> <span className="truncate">{detectedHint.label}</span>
                            </button>
                        )}
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                        {!isOutput && SAMPLE_PAYLOADS[algo] && (
                            <button
                                onClick={() => {
                                    updateWorkspace(ws.id, {
                                        input: SAMPLE_PAYLOADS[algo],
                                        mode: ['hashes'].includes(category) || ['url_all', 'aes_gcm', 'gzip', 'deflate'].includes(algo) ? 'encode' : 'decode'
                                    });
                                    setToast('Sample payload loaded');
                                }}
                                className={`px-1.5 py-0.5 rounded text-[10px] font-medium transition-all flex items-center gap-1 ${
                                    isDark ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                                }`}
                            >
                                <Icons.Zap size={10} /> Sample
                            </button>
                        )}
                        {isOutput && ['uuid', 'passgen'].includes(algo) && (
                            <button
                                onClick={() => setOutput(algo === 'uuid' ? AlgorithmsLib.uuid() : AlgorithmsLib.passgen())}
                                className={`px-1.5 py-0.5 rounded text-[10px] font-medium transition-all ${
                                    isDark ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                                }`}
                            >
                                Regenerate
                            </button>
                        )}
                        {isOutput && !errorMsg && output && (
                            <>
                                <button
                                    onClick={chainOutputToInput}
                                    className={`px-1.5 py-0.5 rounded text-[10px] font-medium transition-all hidden sm:flex items-center gap-1 ${
                                        isDark ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                                    }`}
                                    title="Chain output to input"
                                >
                                    <Icons.CornerUpLeft size={10} /> Chain
                                </button>
                                <button onClick={() => setShowQR(!showQR)} className="p-1 rounded transition-colors hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400" title="QR Code"><Icons.QrCode size={13}/></button>
                                <button onClick={downloadFile} className="p-1 rounded transition-colors hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400" title="Download"><Icons.Download size={13}/></button>
                            </>
                        )}
                        <button
                            onClick={() => setWordWrap(!wordWrap)}
                            className={`p-1 rounded transition-colors ${!wordWrap ? 'text-blue-500' : 'text-slate-500 dark:text-slate-400'} hover:bg-slate-200 dark:hover:bg-slate-700`}
                            title="Toggle Word Wrap"
                        >
                            <Icons.WrapText size={13} />
                        </button>
                        <button
                            onClick={() => setExpandedPane(expandedPane === paneKey ? null : paneKey)}
                            className="p-1 rounded transition-colors hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hidden lg:inline-flex"
                            title={expandedPane === paneKey ? "Restore Split View" : "Maximize Pane"}
                        >
                            {expandedPane === paneKey ? <Icons.Minimize2 size={13} /> : <Icons.Maximize2 size={13} />}
                        </button>
                        <button onClick={() => copyToClipboard(copyVal, setToast)} disabled={!copyVal} className="p-1.5 rounded transition-colors hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 disabled:opacity-30"><Icons.Copy size={15}/></button>
                    </div>
                </div>
            );

            const showInputPane = expandedPane !== 'output' && (mobileView === 'both' || mobileView === 'input');
            const showOutputPane = expandedPane !== 'input' && (mobileView === 'both' || mobileView === 'output');

            return (
                <div className="flex flex-col h-full gap-3 animate-fade-in w-full">
                    {/* MOBILE QUICK VIEW SWITCHER */}
                    <div className="flex lg:hidden items-center justify-between gap-2 shrink-0">
                        <div className={`flex p-0.5 rounded-md border text-[11px] font-medium ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            {[
                                { id: 'both', label: 'Split View' },
                                { id: 'input', label: `Input` },
                                { id: 'output', label: `Output` }
                            ].map(v => (
                                <button
                                    key={v.id}
                                    onClick={() => setMobileView(v.id)}
                                    className={`px-2 py-1 rounded transition-all ${mobileView === v.id ? (isDark ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-800') : 'text-slate-500'}`}
                                >
                                    {v.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row flex-1 min-h-0 gap-2 lg:gap-3">
                        {/* INPUT PANE */}
                        {showInputPane && (
                            <div className="app-panel flex flex-col flex-1 min-h-[210px] sm:min-h-[240px] lg:min-h-0 overflow-hidden">
                                <PaneHeader title="INPUT" isOutput={false} copyVal={input} paneKey="input" />
                                <HighlightedInput
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    isDark={isDark}
                                    wordWrap={wordWrap}
                                    onFileDrop={handleDroppedFile}
                                    placeholder={algo === 'regex_tester' ? "/pattern/gi\n---\ntest string" : "Paste or drop data here..."}
                                />
                                <div className={`px-3 py-1.5 text-[10px] font-mono border-t flex flex-wrap justify-between items-center gap-2 shrink-0 ${isDark ? 'border-slate-800 text-slate-500' : 'border-slate-200 text-slate-400'}`}>
                                    <span>Ln: {inStats.lines}  Ch: {inStats.chars}</span>
                                    <span>{inStats.bytes} B</span>
                                </div>
                            </div>
                        )}

                        {/* ACTION TOOLBAR (Vertical on desktop) */}
                        {expandedPane === null && mobileView === 'both' && (
                            <div className={`flex flex-row lg:flex-col items-center justify-center gap-3 shrink-0 py-2 lg:py-0`}>
                                <button 
                                    onClick={() => applyJsonFormat('beautify')} 
                                    className={`flex items-center justify-center w-8 h-8 rounded-lg transition-all shadow-sm ${isDark ? 'bg-slate-800 text-slate-300 hover:text-white hover:bg-blue-600/20 border border-slate-700 hover:border-blue-500/50' : 'bg-white text-slate-600 hover:text-blue-700 hover:bg-blue-50 border border-slate-200 hover:border-blue-300'}`} 
                                    title="Beautify JSON"
                                >
                                    <Icons.AlignLeft size={14} />
                                </button>
                                
                                <button 
                                    onClick={swap} 
                                    disabled={isLockMode} 
                                    className={`flex items-center justify-center w-10 h-10 rounded-full transition-all group shadow-md ${isLockMode ? 'opacity-30 cursor-not-allowed' : ''} ${isDark ? 'bg-blue-600 text-white hover:bg-blue-500 border border-blue-500' : 'bg-blue-600 text-white hover:bg-blue-700 border border-blue-700'}`} 
                                    title="Swap Input & Output"
                                >
                                    <Icons.ArrowRightLeft size={15} className="transition-transform group-hover:rotate-180 duration-300" />
                                </button>
                                
                                <button 
                                    onClick={() => applyJsonFormat('minify')} 
                                    className={`flex items-center justify-center w-8 h-8 rounded-lg transition-all shadow-sm ${isDark ? 'bg-slate-800 text-slate-300 hover:text-white hover:bg-blue-600/20 border border-slate-700 hover:border-blue-500/50' : 'bg-white text-slate-600 hover:text-blue-700 hover:bg-blue-50 border border-slate-200 hover:border-blue-300'}`} 
                                    title="Minify JSON"
                                >
                                    <Icons.FileCode size={14} />
                                </button>
                            </div>
                        )}

                        {/* OUTPUT PANE */}
                        {showOutputPane && (
                            <div className={`app-panel flex flex-col flex-1 min-h-[210px] sm:min-h-[240px] lg:min-h-0 overflow-hidden ${errorMsg ? (isDark ? 'border-red-900/50' : 'border-red-300') : ''}`}>
                                <PaneHeader title="OUTPUT" isOutput={true} copyVal={output} paneKey="output" />
                                {category === 'hashes' && output && (
                                    <div className={`px-3 py-1.5 border-b flex items-center gap-2 text-xs ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                                        <span className="text-[10px] font-semibold opacity-60 shrink-0">Verify Hash:</span>
                                        <input
                                            type="text"
                                            value={expectedHash}
                                            onChange={e => updateWorkspace(ws.id, { expectedHash: e.target.value })}
                                            placeholder="Paste expected hash..."
                                            className="bg-transparent font-mono text-xs outline-none flex-grow min-w-0"
                                        />
                                        {expectedHash.trim() && (
                                            expectedHash.trim().toLowerCase() === output.trim().toLowerCase()
                                                ? <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-green-500/10 text-green-500 border border-green-500/20 shrink-0">MATCH</span>
                                                : <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-500/10 text-red-500 border border-red-500/20 shrink-0">MISMATCH</span>
                                        )}
                                    </div>
                                )}
                                <div className="editor-container relative">
                                    {isJsonOutput ? (
                                        <div className="absolute inset-0 overflow-auto custom-scrollbar">
                                            <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(formattedJsonOutput) }} className={`m-0 p-3.5 sm:p-4 font-mono text-[13px] leading-[1.5] ${wordWrap ? 'whitespace-pre-wrap break-all' : 'whitespace-pre'} select-text ${isDark ? 'text-slate-300' : 'text-slate-700'}`}></pre>
                                        </div>
                                    ) : (
                                        <textarea
                                            value={errorMsg || output}
                                            readOnly
                                            placeholder="Processed result will appear here..."
                                            className={`absolute inset-0 w-full h-full p-3.5 sm:p-4 resize-none outline-none font-mono text-[13px] leading-[1.5] custom-scrollbar bg-transparent ${wordWrap ? 'whitespace-pre-wrap break-all' : 'whitespace-pre overflow-x-auto'} ${errorMsg ? 'text-red-500' : (isDark ? 'text-slate-300' : 'text-slate-800')}`}
                                            spellCheck="false"
                                        />
                                    )}
                                    
                                    {showQR && (
                                        <div className="absolute inset-0 z-20 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-fade-in">
                                            <div className="bg-white p-2 rounded-lg shadow-xl relative">
                                                <button onClick={() => setShowQR(false)} className="absolute -top-2 -right-2 p-1 bg-slate-800 text-white rounded-full shadow hover:bg-red-500"><Icons.X size={10}/></button>
                                                <canvas ref={qrCanvasRef}></canvas>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className={`px-3 py-1.5 text-[10px] font-mono border-t flex flex-wrap justify-between items-center gap-2 shrink-0 ${isDark ? 'border-slate-800 text-slate-500' : 'border-slate-200 text-slate-400'}`}>
                                    <span>Ln: {outStats.lines}  Ch: {outStats.chars}</span>
                                    <span>{outStats.bytes} B</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        });

        const WorkspaceTab = memo(({ ws, isActive, onSelect, onClose, onRename, isDark, isMainTab }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editName, setEditName] = useState(ws.name);
            const inputRef = useRef(null);

            useEffect(() => { if (isEditing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [isEditing]);

            const handleRenameSubmit = () => {
                setIsEditing(false);
                if (editName.trim() && editName.trim() !== ws.name) onRename(ws.id, editName.trim());
                else setEditName(ws.name);
            };
            const handleKeyDown = (e) => { if (e.key === 'Enter') handleRenameSubmit(); if (e.key === 'Escape') { setIsEditing(false); setEditName(ws.name); } };

            return (
                <div 
                    onClick={() => !isEditing && onSelect(ws.id)} onDoubleClick={() => setIsEditing(true)}
                    className={`group flex items-center gap-2 px-3 py-1.5 min-w-[110px] max-w-[160px] cursor-pointer transition-all border-r shrink-0 relative ${
                        isActive 
                            ? (isDark ? 'bg-slate-900 border-t border-t-blue-500 text-blue-400 z-10 border-r-slate-800' : 'bg-white border-t border-t-blue-600 text-blue-600 z-10 border-r-slate-200')
