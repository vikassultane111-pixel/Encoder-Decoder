                    let r = regex.exec(target);
                    if (r) return JSON.stringify({ matches: [r[0]], captureGroups: r.slice(1), index: r.index }, null, 4);
                    return "No Match Found.";
                }

                while ((match = regex.exec(target)) !== null) {
                    results.push({ match: match[0], captureGroups: match.slice(1), index: match.index });
                    if (match.index === regex.lastIndex) regex.lastIndex++;
                }
                return results.length ? JSON.stringify(results, null, 4) : "No Matches Found.";
            },
            csv2json: (s) => {
                const parseCSVLine = (line) => {
                    const res = [];
                    let cur = '', inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const c = line[i];
                        if (c === '"') {
                            if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
                            else inQuotes = !inQuotes;
                        } else if (c === ',' && !inQuotes) {
                            res.push(cur.trim());
                            cur = '';
                        } else {
                            cur += c;
                        }
                    }
                    res.push(cur.trim());
                    return res;
                };
                let lines = s.trim().split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length < 2) throw new Error("CSV requires a header and data row.");
                let headers = parseCSVLine(lines[0]);
                let res = [];
                for (let i = 1; i < lines.length; i++) {
                    let obj = {};
                    let currentLine = parseCSVLine(lines[i]);
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j] : '';
                    }
                    res.push(obj);
                }
                return JSON.stringify(res, null, 4);
            }
        };

        const DEFAULT_WORKSPACE = { id: 1, name: 'Main Payload', input: '', output: '', mode: 'decode', category: 'encoders', algo: 'base64', caesarShift: 13, vigenereKey: 'KEY', strUtilMode: 'upper', expectedHash: '', secretKey: 'shiva_secret_2026' };

        function App() {
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem('dx_theme_v3') || 'dark'; } catch (e) { return 'dark'; }

            const [isCmdOpen, setIsCmdOpen] = useState(false);
            const [globalClearKey, setGlobalClearKey] = useState(0);

            const [liveUsersCount, setLiveUsersCount] = useState(1);
            const [liveNodesList, setLiveNodesList] = useState([]);
            const [currentUserId, setCurrentUserId] = useState('');
            const [showPresenceInfo, setShowPresenceInfo] = useState(false);
            const activeRecordsRef = useRef([]);
            const shieldClickTrackerRef = useRef({ count: 0, timer: null });

            const handleShieldClick = () => {
                const tracker = shieldClickTrackerRef.current;
                tracker.count += 1;

                if (tracker.timer) clearTimeout(tracker.timer);

                if (tracker.count >= 3) {
                    tracker.count = 0;
                    tracker.timer = null;
                    setShowPresenceInfo(prev => !prev);
                } else {
                    tracker.timer = setTimeout(() => {
                        tracker.count = 0;
                        tracker.timer = null;

                }
            };

            const [workspaces, setWorkspaces] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('dx_workspaces_v3'));
                    if (Array.isArray(saved) && saved.length > 0) return saved;
                } catch (e) {}
                return [DEFAULT_WORKSPACE];
            });
            const [activeWorkspaceId, setActiveWorkspaceId] = useState(1);
            const [nextWorkspaceId, setNextWorkspaceId] = useState(() => {
                return Math.max(...workspaces.map(w => w.id), 1) + 1;
            });

            const [curlInput, setCurlInput] = useState('');
            const [curlParsed, setCurlParsed] = useState(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                try { localStorage.setItem('dx_workspaces_v3', JSON.stringify(workspaces)); } catch (e) {}
            }, [workspaces]);

            useEffect(() => {
                try { localStorage.setItem('dx_theme_v3', theme); } catch (e) {}
            }, [theme]);

            useEffect(() => {
                let isMounted = true;
                let heartbeatTimer = null;
                let pruneTimer = null;

                let bc = null;
                let globalWs = null;
                let wsReconnectTimer = null;
                let lastHereReplyTs = 0;

                const ACTIVE_TTL = 65000;
                const GLOBAL_TOPIC = 'dx_pro_suite_shiva_live_v4';
                const peerRegistry = new Map();

                const recalculateLiveCount = () => {
                    if (!isMounted) return;
                    const now = Date.now();
                    const mergedMap = new Map();

                    activeRecordsRef.current.forEach(rec => {
                        const key = rec?.deviceId || rec?.identityKey || rec?.userId;
                        if (key && rec.lastSeen && (now - rec.lastSeen < ACTIVE_TTL)) {
                            mergedMap.set(key, {
                                deviceId: key,
                                userId: rec.userId || key,
                                ipMasked: rec.ipMasked || 'Active',
                                deviceType: rec.deviceType || 'Device',
                                lastSeen: rec.lastSeen
                            });
                        }
                    });

                    peerRegistry.forEach((rec, key) => {
                        if (rec && rec.lastSeen && (now - rec.lastSeen < ACTIVE_TTL)) {
                            const existing = mergedMap.get(key);
                            if (!existing || rec.lastSeen > existing.lastSeen) {
                                mergedMap.set(key, rec);
                            }
                        } else {
                            peerRegistry.delete(key);
                        }
                    });

                    const nodes = Array.from(mergedMap.values());
                    setLiveNodesList(nodes);
                    setLiveUsersCount(Math.max(1, nodes.length));
                };

                const initLivePresence = async () => {
                    const clientMeta = await computeClientIdentity();
                    if (!isMounted) return;

                    const myNodeId = clientMeta.deviceId;
                    setCurrentUserId(myNodeId);

                    const registerSelfLocally = () => {
                        peerRegistry.set(myNodeId, {
                            deviceId: myNodeId,
                            userId: currentAuthUser?.uid || myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            lastSeen: Date.now()
                        });
                        recalculateLiveCount();
                    };

                    registerSelfLocally();

                    const publishGlobalSignal = (signalType) => {
                        const payload = {
                            type: signalType,
                            deviceId: myNodeId,
                            userId: currentAuthUser?.uid || myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            ts: Date.now()
                        };
                        fetch(`https://ntfy.sh/${GLOBAL_TOPIC}`, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        }).catch(() => {});
                    };

                    const connectGlobalWebSocket = () => {
                        if (!isMounted) return;
                        try {
                            globalWs = new WebSocket(`wss://ntfy.sh/${GLOBAL_TOPIC}/ws?since=60s`);
                            globalWs.onopen = () => { publishGlobalSignal('join'); };
                            globalWs.onmessage = (ev) => {
                                try {
                                    const outer = JSON.parse(ev.data);
                                    if (outer.event !== 'message' || !outer.message) return;
                                    const eventTimeMs = outer.time ? outer.time * 1000 : Date.now();
                                    if (Date.now() - eventTimeMs > ACTIVE_TTL) return;

                                    const data = JSON.parse(outer.message);
                                    if (!data || !data.deviceId) return;

                                    if (data.type === 'leave') {
                                        peerRegistry.delete(data.deviceId);
                                        recalculateLiveCount();
                                        return;
                                    }

                                    peerRegistry.set(data.deviceId, {
                                        deviceId: data.deviceId,
                                        userId: data.userId || data.deviceId,
                                        ipMasked: data.ipMasked || 'Remote',
                                        deviceType: data.deviceType || 'Device',
                                        lastSeen: Date.now()
                                    });
                                    recalculateLiveCount();

                                    if (data.type === 'join' && data.deviceId !== myNodeId) {
                                        const now = Date.now();
                                        if (now - lastHereReplyTs > 3500) {
                                            lastHereReplyTs = now;
                                            setTimeout(() => {
                                                if (isMounted) publishGlobalSignal('here');
                                            }, 150 + Math.floor(Math.random() * 400));
                                        }
                                    }
                                } catch (err) {}
                            };
                            globalWs.onclose = () => {
                                if (isMounted) wsReconnectTimer = setTimeout(connectGlobalWebSocket, 5000);
                            };
                        } catch (e) {}
                    };

                    connectGlobalWebSocket();

                    try {
                        bc = new BroadcastChannel('decoderx_live_presence_v4');
                        bc.postMessage({
                            type: 'ping',
                            deviceId: myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            ts: Date.now()
                        });
                        bc.onmessage = (ev) => {
                            if (ev.data && ev.data.deviceId) {
                                if (ev.data.type === 'leave') {
                                    peerRegistry.delete(ev.data.deviceId);
                                } else {
                                    peerRegistry.set(ev.data.deviceId, {
                                        deviceId: ev.data.deviceId,
                                        userId: ev.data.userId || ev.data.deviceId,
                                        ipMasked: ev.data.ipMasked || clientMeta.ipMasked,
                                        deviceType: ev.data.deviceType || clientMeta.deviceType,
                                        lastSeen: Date.now()
                                    });
                                }
                                recalculateLiveCount();
                            }
                        };
                    } catch (e) {}

                    const sdk = window.__DX_FIREBASE_SDK__;
                    if (sdk && typeof __firebase_config !== 'undefined' && __firebase_config) {
                        try {
                            const firebaseConfig = JSON.parse(__firebase_config);
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                            const app = sdk.initializeApp(firebaseConfig);
                            const auth = sdk.getAuth(app);
                            const db = sdk.getFirestore(app);

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await sdk.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await sdk.signInAnonymously(auth);
                            }

                            const user = auth.currentUser;
                            if (user && isMounted) {
                                currentAuthUser = user;
                                setCurrentUserId(`${myNodeId} (${user.uid})`);

                                userDocRef = sdk.doc(db, 'artifacts', appId, 'public', 'data', 'active_users', myNodeId);
                                const usersColRef = sdk.collection(db, 'artifacts', appId, 'public', 'data', 'active_users');

                                const pushFirestoreHeartbeat = async () => {
                                    if (!currentAuthUser) return;
                                    try {
                                        await sdk.setDoc(userDocRef, {
                                            deviceId: myNodeId,
                                            userId: currentAuthUser.uid,
                                            identityKey: myNodeId,
                                            ipMasked: clientMeta.ipMasked,
                                            deviceType: clientMeta.deviceType,
                                            lastSeen: Date.now()
                                        });
                                    } catch (err) {}
                                };

                                await pushFirestoreHeartbeat();

                                unsubscribeSnapshot = sdk.onSnapshot(
                                    usersColRef,
                                    (snapshot) => {
                                        const list = [];
                                        snapshot.forEach(d => list.push(d.data()));
                                        activeRecordsRef.current = list;
                                        recalculateLiveCount();
                                    },
                                    () => {}
                                );
                            }
                        } catch (e) {}
                    }

                    heartbeatTimer = setInterval(() => {
                        registerSelfLocally();
                        publishGlobalSignal('ping');
                        if (bc) {
                            try {
                                bc.postMessage({
                                    type: 'ping',
                                    deviceId: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    ts: Date.now()
                                });
                            } catch (e) {}
                        }
                        if (userDocRef && currentAuthUser && window.__DX_FIREBASE_SDK__) {
                            try {
                                window.__DX_FIREBASE_SDK__.setDoc(userDocRef, {
                                    deviceId: myNodeId,
                                    userId: currentAuthUser.uid,
                                    identityKey: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    lastSeen: Date.now()
                                });
                            } catch (e) {}
                        }
                    }, 22000);

                    pruneTimer = setInterval(() => recalculateLiveCount(), 8000);
                };

                if (window.__DX_FIREBASE_SDK__) {
                    initLivePresence();
                } else {
                    window.addEventListener('dx-firebase-ready', initLivePresence, { once: true });
                }

                return () => {
                    isMounted = false;
                    if (heartbeatTimer) clearInterval(heartbeatTimer);
                    if (pruneTimer) clearInterval(pruneTimer);
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);

                    if (globalWs) { try { globalWs.close(); } catch (e) {} }

            useEffect(() => {

            useEffect(() => {

                        setIsCmdOpen(prev => !prev);

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(null), 3000);
                return () => clearTimeout(timer);

            const isDark = theme === 'dark';

            const addWorkspace = () => {
                if (workspaces.length >= 10) return setToast("Max 10 tabs");
                const newId = nextWorkspaceId;
                setWorkspaces([...workspaces, { ...DEFAULT_WORKSPACE, id: newId, name: `Tab ${newId}` }]);

                setNextWorkspaceId(newId + 1);

                if (workspaces.length === 1) { updateWorkspace(id, { input: '', output: '' }); return; }
                const updated = workspaces.filter(ws => ws.id !== id);
                setWorkspaces(updated);
                if (activeWorkspaceId === id) setActiveWorkspaceId(updated[updated.length - 1].id);
            };

            const renameWorkspace = (id, newName) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, name: newName } : w));
            const updateWorkspace = useCallback((id, updates) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, ...updates } : w)), []);

                });

                    ...prev,
                    {
                        ...DEFAULT_WORKSPACE,
                        id: newId,
                        name: label ? label.slice(0, 16) : `cURL ${newId}`,

                                            <Icons.X size={12} className="cursor-pointer opacity-60 hover:opacity-100" />
                                        </div>
                                        <div className="space-y-1 max-h-32 overflow-y-auto mb-2 pr-1">
                                            {liveNodesList.map((node, idx) => (
                                                <div key={node.deviceId || idx} className={`flex items-center justify-between px-2 py-1 rounded text-[10px] font-mono ${isDark ? 'bg-slate-800' : 'bg-slate-100'}`}>
                                                    <span className="truncate">{node.deviceType || 'Node'} • {node.ipMasked}</span>
                                                    <span className="text-blue-500 ml-2 shrink-0">●</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="text-[9px] opacity-50 font-mono break-all border-t pt-1.5 border-slate-700/40">
                                            ID: {currentUserId || 'Initializing...'}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className={`hidden sm:block h-4 w-px shrink-0 ${isDark ? 'bg-slate-700' : 'bg-slate-300'}`}></div>
                            
                            <div className="hidden lg:flex items-center gap-1.5 shrink-0">
                                <span className={`text-[10px] font-mono tracking-wide ${isDark ? 'text-slate-500' : 'text-slate-500'}`}>
                                    [ By Mr Shiva ]
                                </span>
                                {showPresenceInfo && (
                                    <button
                                        type="button"
                                        onClick={() => setShowPresenceInfo(false)}
                                        className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-mono transition-all shrink-0 animate-fade-in ${
                                            isDark 
                                            ? 'bg-slate-800 text-blue-400 hover:bg-slate-700' 
                                            : 'bg-slate-100 text-blue-600 hover:bg-slate-200'
                                        }`}
                                        title="Click to hide Live Users"
                                    >
                                        <Icons.Users size={10} />
                                        <span>{liveUsersCount}</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* TOP MODULE TABS */}
                        <div className="flex shrink-0">
                            <button onClick={() => setActiveTab('decoderx')} className={`px-3 py-1.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-1.5 ${activeTab === 'decoderx' ? (isDark ? 'border-blue-500 text-blue-400' : 'border-blue-600 text-blue-600') : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                                <Icons.Terminal size={13}/> <span>Editor</span>
                            </button>
                            <button onClick={() => setActiveTab('curl')} className={`px-3 py-1.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-1.5 ${activeTab === 'curl' ? (isDark ? 'border-blue-500 text-blue-400' : 'border-blue-600 text-blue-600') : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                                <Icons.Layers size={13}/> <span>cURL</span>
                            </button>
                            <button onClick={() => setActiveTab('diff')} className={`px-3 py-1.5 text-xs font-medium border-b-2 transition-colors flex items-center gap-1.5 ${activeTab === 'diff' ? (isDark ? 'border-blue-500 text-blue-400' : 'border-blue-600 text-blue-600') : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                                <Icons.GitCompare size={13}/> <span className="hidden md:inline">Diff</span>
                            </button>
                        </div>

                        {/* RIGHT ACTIONS */}
                        <div className="flex items-center gap-1.5 sm:gap-3 shrink-0">
                            <button
                                onClick={handleGlobalClearAll}
                                className={`px-2.5 sm:px-3 py-1.5 rounded-md text-[11px] font-bold flex items-center gap-1.5 transition-all shadow-sm ${
                                    isDark 
                                    ? 'bg-red-900/40 text-red-400 hover:bg-red-900/60 border border-red-900/50' 
                                    : 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200'
                                }`}
                                title="Clear All Workspaces & Data"
                            >
                                <Icons.Trash2 size={14} />
                                <span className="hidden sm:inline whitespace-nowrap">Clear All</span>
                            </button>

                            <button
                                onClick={() => setIsCmdOpen(true)}
                                className={`px-2 sm:px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-2 transition-colors ${
                                    isDark ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                                title="Command Palette (Ctrl + K)"
                            >
                                <Icons.Search size={13} />
                                <span className="hidden lg:inline text-[11px]">Search...</span>
                                <kbd className={`hidden sm:inline-block px-1 rounded text-[9px] font-mono ${isDark ? 'bg-slate-700 text-slate-400' : 'bg-white text-slate-500'}`}>Ctrl K</kbd>
                            </button>

                            <button 
                                onClick={() => setIsContactOpen(true)}
                                className={`px-2 sm:px-3 py-1.5 rounded-md text-[11px] font-semibold flex items-center gap-1.5 transition-all ${
                                    isDark 
                                    ? 'bg-blue-600 text-white hover:bg-blue-700' 
                                    : 'bg-blue-600 text-white hover:bg-blue-700'
                                }`}
                                title="Contact Mr Shiva"
                            >
                                <Icons.MessageSquare size={13} />
                                <span className="hidden md:inline">Feedback</span>
                            </button>

                            <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className={`p-1.5 rounded-md transition-colors ${isDark ? 'text-slate-400 hover:bg-slate-800 hover:text-white' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`} title="Toggle Theme">
                                {isDark ? <Icons.Sun size={15} /> : <Icons.Moon size={15} />}
                            </button>
                        </div>
                    </header>

                    {/* MODALS */}
                    <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} isDark={isDark} setToast={setToast} />
                    <CommandPalette isOpen={isCmdOpen} onClose={() => setIsCmdOpen(false)} onSelectTool={handleSelectToolFromPalette} isDark={isDark} />

                    {/* MAIN WORKSPACE AREA */}
                    <div className="flex-1 flex flex-col min-h-0 relative">
                        
                        {/* SECONDARY TOOLBAR */}
                        <div className={`shrink-0 flex flex-wrap items-center justify-between gap-3 px-3 sm:px-4 py-2 border-b z-10 ${isDark ? 'bg-slate-900/40 border-slate-800' : 'bg-slate-50/50 border-slate-200'}`}>
                            
                            {activeTab === 'decoderx' && activeWs ? (
                                <div className="flex flex-wrap items-center gap-2 sm:gap-3 flex-1 min-w-0">
                                    <CustomSelect 
                                        isDark={isDark} icon={toolCategories.find(c => c.id === activeWs.category)?.icon}
                                        value={activeWs.category} options={toolCategories}
                                        onChange={(e) => {
                                            const cat = e.target.value;
                                            const firstAlgo = algorithms.find(a => a.category === cat);
                                            updateWorkspace(activeWorkspaceId, {
                                                category: cat,
                                                algo: firstAlgo.id,
                                                mode: cat === 'hashes' || ['uuid', 'passgen', 'url_all', 'aes_gcm', 'gzip', 'deflate'].includes(firstAlgo.id) ? 'encode' : 'decode'
                                            });
                                        }}
                                    />
                                    <CustomSelect 
                                        isDark={isDark} icon={algorithms.find(a => a.id === activeWs.algo)?.icon}
                                        value={activeWs.algo} options={algorithms.filter(a => a.category === activeWs.category)}
                                        onChange={(e) => {
                                            const a = e.target.value;
                                            updateWorkspace(activeWorkspaceId, {
                                                algo: a,
                                                mode: (activeWs.category === 'hashes' || ['uuid', 'passgen', 'url_all'].includes(a))
                                                    ? 'encode'
                                                    : (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'extract_secrets', 'epoch', 'regex_tester', 'csv2json', 'cidr'].includes(a) ? 'decode' : activeWs.mode)
                                            });
                                        }}
                                    />
                                    
                                    {!['uuid', 'passgen'].includes(activeWs.algo) && (
                                        <div className={`flex p-0.5 rounded-md border h-8 items-center ${['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'extract_secrets', 'uuid', 'passgen', 'epoch', 'string_utils', 'waf_tamper', 'regex_tester', 'csv2json', 'cidr'].includes(activeWs.algo) || activeWs.category === 'hashes' ? 'opacity-40 pointer-events-none' : ''} ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                                            {['encode', 'decode'].map(m => (
                                                <button key={m} onClick={() => updateWorkspace(activeWorkspaceId, { mode: m })} className={`px-3 h-full text-[11px] font-semibold uppercase rounded transition-colors ${activeWs.mode === m ? (isDark ? 'bg-slate-700 text-white' : 'bg-white text-slate-800 shadow-sm') : 'text-slate-500'}`}>{m}</button>
                                            ))}
                                        </div>
                                    )}

                                    {activeWs.algo === 'caesar' && (
                                        <div className={`flex items-center gap-2 px-3 h-8 rounded-md border text-xs ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                                            <span className="text-[10px] font-medium uppercase opacity-60">Shift:</span>
                                            <input type="range" min="1" max="25" value={activeWs.caesarShift} onChange={e => updateWorkspace(activeWorkspaceId, { caesarShift: e.target.value })} className="w-20 cursor-pointer accent-blue-500" />
                                            <span className="font-mono font-medium text-blue-500 w-5 text-center">{activeWs.caesarShift}</span>
                                        </div>
                                    )}

                                    {activeWs.algo === 'vigenere' && (
                                        <div className={`flex items-center gap-2 px-3 h-8 rounded-md border text-xs ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                                            <span className="text-[10px] font-medium uppercase opacity-60">Key:</span>
                                            <input type="text" value={activeWs.vigenereKey} onChange={e => updateWorkspace(activeWorkspaceId, { vigenereKey: e.target.value.toUpperCase().replace(/[^A-Z]/g, '') })} placeholder="SECRET" className="w-20 bg-transparent font-mono font-medium text-blue-500 uppercase outline-none" />
                                        </div>
                                    )}

                                    {['hmac_sha256', 'aes_gcm', 'jwt'].includes(activeWs.algo) && (
                                        <div className={`flex items-center gap-2 px-3 h-8 rounded-md border text-xs ${isDark ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'}`}>
                                            <Icons.Key size={12} className="text-blue-500 shrink-0" />
                                            <span className="text-[10px] font-medium uppercase opacity-60 shrink-0">
                                                {activeWs.algo === 'jwt' ? 'HS256 Secret:' : 'Secret Key:'}
                                            </span>
                                            <input
                                                type="text"
                                                value={activeWs.secretKey || ''}
                                                onChange={e => updateWorkspace(activeWorkspaceId, { secretKey: e.target.value })}
                                                placeholder={activeWs.algo === 'jwt' ? 'Verify key...' : 'Passphrase...'}
                                                className="w-28 sm:w-36 bg-transparent font-mono font-medium text-blue-500 outline-none"
                                            />
                                        </div>
                                    )}

                                    {activeWs.algo === 'string_utils' && (
                                        <div className={`flex p-0.5 rounded-md border h-8 items-center ${isDark ? 'bg-slate-900 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                                            {['upper', 'lower', 'title'].map(m => (
                                                <button key={m} onClick={() => updateWorkspace(activeWorkspaceId, { strUtilMode: m })} className={`px-2.5 h-full text-[11px] font-semibold uppercase rounded transition-colors ${activeWs.strUtilMode === m ? (isDark ? 'bg-slate-700 text-blue-400' : 'bg-white text-blue-600 shadow-sm') : 'text-slate-500'}`}>{m}</button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : activeTab === 'curl' ? (
                                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-2"><Icons.Layers size={13}/> cURL Inspector</div>
                            ) : (
                                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-2"><Icons.GitCompare size={13}/> Payload Diff</div>
                            )}

                            {activeTab !== 'diff' && (
                                <div className="flex items-center gap-1.5 ml-auto shrink-0">
                                    <input type="file" ref={fileInputRef} onChange={handleGlobalFileLoad} className="hidden" accept=".txt,.json,.xml,.csv,.log,.md,.bin,.key,.pem" />
                                    <button onClick={() => fileInputRef.current.click()} className={`flex items-center gap-1.5 h-7 px-2.5 text-[11px] font-medium rounded border transition-colors ${isDark ? 'border-slate-700 text-slate-300 hover:bg-slate-800' : 'border-slate-300 text-slate-600 hover:bg-slate-100'}`}><Icons.Upload size={12} /> <span className="hidden xs:inline">Import</span></button>
                                    <button onClick={handleGlobalClear} className={`flex items-center gap-1.5 h-7 px-2.5 text-[11px] font-medium rounded border transition-colors ${isDark ? 'border-red-900/40 text-red-400 hover:bg-red-900/30' : 'border-red-200 text-red-600 hover:bg-red-50'}`}><Icons.Trash2 size={12} /> <span className="hidden xs:inline">Clear</span></button>
                                </div>
                            )}
                        </div>

                        {/* WORKSPACE TAB STRIP */}
                        <div className={activeTab === 'decoderx' ? `shrink-0 flex items-end pt-1.5 overflow-x-auto tab-scroll ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-slate-50 border-slate-200'}` : "hidden"}>
                            {workspaces.map((ws, index) => <WorkspaceTab key={ws.id} ws={ws} isActive={activeWorkspaceId === ws.id} onSelect={setActiveWorkspaceId} onClose={removeWorkspace} onRename={renameWorkspace} isDark={isDark} isMainTab={index === 0} />)}
                            <button onClick={addWorkspace} className={`ml-1 mb-1 p-1 rounded transition-colors shrink-0 ${isDark ? 'text-slate-500 hover:text-white hover:bg-slate-800' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200'}`} title="New Tab"><Icons.Plus size={14} /></button>
                        </div>

                        {/* CONTENT SCROLL AREA */}
                        <div className={`flex-1 overflow-y-auto flex justify-center w-full ${isDark ? 'bg-slate-950' : 'bg-slate-100'}`}>
                            <div className="w-full max-w-[1600px] h-full p-3 sm:p-4 lg:p-5">
                                <div className={activeTab === 'decoderx' ? "block h-full" : "hidden"}>
                                    {workspaces.map(ws => (
                                        <div key={ws.id} className={activeWorkspaceId === ws.id ? 'block h-full animate-fade-in' : 'hidden'}>
                                            <StandardDecoderTab isDark={isDark} setToast={setToast} AlgorithmsLib={algosLib} ws={ws} updateWorkspace={updateWorkspace} />
                                        </div>
                                    ))}
                                </div>
                                <div className={activeTab === 'curl' ? "block h-full animate-fade-in" : "hidden"}>
                                    <CurlDecoderTab
                                        isDark={isDark}
                                        setToast={setToast}
                                        curlInput={curlInput}
                                        setCurlInput={setCurlInput}
                                        parsedResults={curlParsed}
                                        setParsedResults={setCurlParsed}
                                        onSendToEditor={handleSendFromCurlToEditor}
                                    />
                                </div>
                                <div className={activeTab === 'diff' ? "block h-full animate-fade-in" : "hidden"}>
                                    <DiffCheckerTab key={globalClearKey} isDark={isDark} setToast={setToast} />
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    
                    {/* GLOBAL TOAST NOTIFICATION */}
                    {toast && (
                        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 animate-slide-up max-w-[90vw]">
                            <div className={`flex items-center gap-2 px-3 py-2 rounded shadow-md border text-[11px] font-medium tracking-wide truncate ${isDark ? 'border-slate-700 text-slate-200 bg-slate-800' : 'border-slate-200 text-slate-700 bg-white'}`}>
                                <div className={`p-1 rounded shrink-0 ${isDark ? 'bg-blue-500/20 text-blue-400' : 'bg-blue-100 text-blue-600'}`}><Icons.Check size={10} /></div>
                                <span className="truncate">{toast}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
